<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Примерка кровли 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #173137;
    --muted: #48666b;
    --line: #d3e5e4;
    --panel: #edf7f5;
    --accent: #087b70;
    --accent-dark: #08675e;
    --accent-light: #dbf5ef;
    --warm: #b84625;
    --warm-light: #fff1e7;
    --shadow: 0 4px 16px #18464a0c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font: 14px Inter, system-ui, sans-serif; color: var(--ink); background: var(--panel); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, .tg input:focus-visible + i {
    outline: 2px solid var(--accent-dark);
    outline-offset: 3px;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .app-header {
    position: relative; z-index: 2; flex: none; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .app-header h1 { font-size: clamp(16px, 2vw, 22px); font-weight: 700; letter-spacing: -.035em; line-height: 1.15; }
  .header-actions { position: relative; flex: none; }
  .header-actions .seg button { min-height: 38px; padding-inline: 13px; }
  .action-details {
    position: absolute; right: 0; top: calc(100% + 9px); width: min(345px, calc(100vw - 24px)); z-index: 1;
    padding: 10px 36px 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
    box-shadow: 0 8px 25px #123c4526;
  }
  #dismiss-action {
    position: absolute; top: 6px; right: 6px; width: 25px; height: 25px;
    border: 0; border-radius: 6px; background: var(--panel); color: var(--ink); font-size: 17px;
  }
  .action-details:has(#action-status:empty):has(#share-url[hidden]) { display: none; }
  #workspace { display: flex; flex: 1; min-height: 0; gap: 14px; padding: 14px; max-width: 1920px; width: 100%; margin-inline: auto; }
  #view { position: relative; flex: 1; min-width: 0; border-radius: 17px; overflow: hidden; background: linear-gradient(#9fc0e2, #dbe7f2 60%, #c9d3bb); }
  #view:fullscreen { width: 100%; height: 100%; border-radius: 0; }
  #app.is-expanded .app-header, #app.is-expanded aside { display: none; }
  #app.is-expanded #workspace { padding: 0; max-width: none; }
  #app.is-expanded #view { flex: 1; height: auto; border-radius: 0; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud, .viewbtns button, #views {
    background: #f6fffcf2;
    border: 1px solid #fff;
    box-shadow: 0 5px 20px #123c451c;
  }
  .hud {
    position: absolute; left: 16px; top: 16px; border-left: 4px solid var(--accent);
    border-radius: 13px; padding: 10px 13px; font-size: 13px; line-height: 1.55;
    max-width: calc(100% - 200px); color: var(--muted);
  }
  .hud b { font-weight: 700; color: var(--ink); }
  .viewbtns { position: absolute; right: 16px; top: 16px; display: flex; gap: 8px; }
  .viewbtns button { color: var(--accent-dark); border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 650; }
  .viewbtns button.on { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  #views {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; padding: 4px; border-radius: 13px; white-space: nowrap;
  }
  #views button {
    border: 0; background: transparent; color: var(--ink); border-radius: 8px;
    padding: 8px 10px; min-height: 35px; font-size: 12px; font-weight: 650;
  }
  #views button[aria-pressed="true"] { background: var(--accent-dark); color: #fff; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  aside {
    width: 370px; flex: none; overflow-y: auto; min-height: 0;
    padding: 1px 4px 10px 1px; scrollbar-color: #95c9c0 transparent;
  }
  aside section {
    margin-top: 12px; padding: 13px 13px 14px;
    border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow);
  }
  aside section:first-child { margin-top: 0; }
  h2 { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 9px; display: flex; justify-content: space-between; gap: 8px; }
  h2 span { text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 550; text-align: right; }
  h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 0 7px; display: flex; justify-content: space-between; }
  h3 span { color: var(--ink); }
  .types { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
  .types button, .seg button {
    border: 1px solid var(--line); background: #f7fcfa; color: var(--ink); border-radius: 9px;
    font-size: 12px; font-weight: 600; line-height: 1.25;
  }
  .types button { padding: 7px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .types button svg { width: 42px; height: 30px; }
  .types button svg rect { fill: #d3e9e3; }
  .types button svg path { fill: #466e72; }
  .types button svg path[fill="#d8d2c6"] { fill: #d3e9e3; }
  .types button small { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .types button.on, .seg.small button.on { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .types button.on svg path:not([fill="#d8d2c6"]) { fill: var(--accent); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; padding: 8px 7px; white-space: nowrap; }
  .seg button.on { border-color: var(--accent-dark); background: var(--accent-dark); color: #fff; }
  .seg.small { margin-top: 7px; }
  .seg.small button { padding: 7px 6px; }
  #export { background: var(--warm); border-color: var(--warm); color: #fff; }
  #share { background: var(--warm-light); border-color: #f2cbb7; color: #8f3218; }
  #action-status { font-size: 12px; line-height: 1.5; color: var(--muted); }
  #action-status:empty { margin-top: 0; }
  #share-url { width: 100%; margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: inherit; }
  .sw { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 7px; }
  .sw.f5 { grid-template-columns: repeat(5,minmax(0,1fr)); }
  .sw button { aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px #17313726; }
  .sw button.on { border-color: var(--accent-dark); box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--accent-light); }
  .row { margin-bottom: 12px; }
  .row label { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 4px; }
  .row label b { background: var(--accent-light); color: var(--accent-dark); border-radius: 5px; padding: 2px 6px; font-weight: 650; white-space: nowrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .tg { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #e8f3f0; font-size: 13px; cursor: pointer; user-select: none; }
  .tg:last-child { border-bottom: 0; }
  .tg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .tg i { width: 38px; height: 22px; border-radius: 11px; background: #b8ccce; position: relative; flex: none; transition: background .15s; }
  .tg i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px #17313740; }
  .tg input:checked + i { background: var(--accent); }
  .tg input:checked + i::after { transform: translateX(16px); }
  .hint { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  @media (hover:hover) {
    .types button:hover, .seg button:not(.on):hover { border-color: var(--accent); }
    .viewbtns button:not(.on):hover, #views button:not([aria-pressed="true"]):hover { background: var(--accent-light); }
    #export:hover { background: #9b341a; }
  }
  @media (max-width:1040px) {
    .hud { max-width: calc(100% - 130px); }
    .viewbtns { flex-direction: column; gap: 5px; }
  }
  @media (max-width:820px) {
    .app-header { padding: 9px 12px; }
    .header-actions .seg button { min-height: 34px; padding: 6px 8px; font-size: 11px; }
    #workspace { flex-direction: column; gap: 9px; padding: 9px; }
    #view { flex: none; height: 50%; border-radius: 13px; }
    aside { width: 100%; flex: 1; padding: 1px 1px 10px; }
    #views { bottom: 8px; gap: 1px; }
    #views button { min-height: 32px; padding: 6px; font-size: 11px; }
    .hud { left: 10px; top: 10px; max-width: calc(100% - 128px); padding: 8px 10px; font-size: 11.5px; }
    .viewbtns { right: 10px; top: 10px; }
    .viewbtns button { padding: 7px 8px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .tg i, .tg i::after { transition: none; }
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>Примерка кровли</h1>
    <div class="header-actions">
      <div class="seg"><button id="share">Ссылка</button><button id="export">Сохранить PNG</button></div>
      <div class="action-details">
        <button id="dismiss-action" aria-label="Закрыть уведомление">×</button>
        <div id="action-status" role="status" aria-live="polite"></div>
        <input id="share-url" aria-label="Ссылка на конфигурацию" readonly hidden>
      </div>
    </div>
  </header>
  <main id="workspace">
    <div id="view">
      <canvas id="c" aria-label="Интерактивная 3D-модель дома" title="Перетащите для поворота. Прокрутка или щипок меняют масштаб."></canvas>
      <div id="loading">Загрузка 3D…</div>
      <div class="hud" id="stats"></div>
      <div class="viewbtns">
        <button id="rot">⟳ Вращать</button>
        <button id="reset">Сбросить вид</button>
        <button id="fullscreen" type="button" aria-controls="view">На весь экран</button>
      </div>
      <div id="views" role="group" aria-label="Ракурсы модели">
        <button data-view="overview" aria-pressed="false">Общий</button>
        <button data-view="front" aria-pressed="false">Спереди</button>
        <button data-view="side" aria-pressed="false">Сбоку</button>
        <button data-view="top" aria-pressed="false">Сверху</button>
        <button data-view="roof" aria-pressed="false">Кровля</button>
      </div>
    </div>
    <aside aria-label="Настройки дома и кровли">
      <section>
        <h2>Форма крыши</h2>
        <div class="types" id="types"></div>
      </section>

      <section>
        <h2>Профиль кровли</h2>
        <div class="seg" id="mats"></div>
        <div class="seg small" id="coats"></div>
      </section>

      <section>
        <h2>Цвет кровли <span id="ralname"></span></h2>
        <div class="sw" id="rals"></div>
      </section>

      <section>
        <h2>Элементы кровли</h2>
        <h3>Форма конька</h3>
        <div class="seg small" id="ridge-style"></div>
        <div id="toggles"></div>
        <div id="skysl" style="margin-top:12px"></div>
        <p class="hint">Окна можно перетаскивать мышью или пальцем по скату.</p>
        <h3>Цвет водостока</h3>
        <div class="seg small" id="gutcol"></div>
      </section>

      <section>
        <h2>Дом <span id="facname"></span></h2>
        <div class="sw f5" id="facade"></div>
        <h3>Цоколь <span id="plname"></span></h3>
        <div class="sw" id="plinth"></div>
        <h3>Окна и двери</h3>
        <div class="seg small" id="frames"></div>
      </section>

      <section>
        <h2>Размеры</h2>
        <div id="sliders"></div>
        <div id="overhang-note" class="sub" role="status" aria-live="polite"></div>
      </section>

      <section>
        <h2>Окружение</h2>
        <div class="row"><label for="hour"><span>Время суток</span><b id="hourv"></b></label><input type="range" id="hour" min="6.5" max="19.5" step="0.25"></div>
        <div id="envtoggles"></div>
      </section>
    </aside>
  </main>
</div>

<script type="module">
try {
const THREE = await import('three');
const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

/* ================= данные ================= */
const S = { type:'gable', mat:'tile', coat:'gloss', ral:'8017', W:8, L:10, H:3.2, A:30, O:0.5,
            facade:0, plinth:0, frames:0, trims:true, snow:true, gutter:true, trees:true, hour:15.5,
            skyN:1, skyPos:0.5, skylights:{}, gutCol:'roof', ridgeStyle:'round' };

const TYPES = [
  { id:'shed',    name:'Односкатная', n:1, icon:'<rect x="9" y="15" width="24" height="13" fill="#d8d2c6"/><path d="M5 17 L37 5 L37 9 L5 21Z" fill="#45322E"/>' },
  { id:'gable',   name:'Двускатная',  n:2, icon:'<rect x="9" y="15" width="24" height="13" fill="#d8d2c6"/><path d="M4 18 L21 4 L38 18 L35 18 L21 7 L7 18Z" fill="#45322E"/><path d="M9 16 L21 6.5 L33 16Z" fill="#d8d2c6"/>' },
  { id:'hip',     name:'Вальмовая',   n:4, icon:'<rect x="9" y="15" width="24" height="13" fill="#d8d2c6"/><path d="M4 17 L14 6 L28 6 L38 17Z" fill="#45322E"/><path d="M4 17 L14 6 L14 17Z" fill="#5b4540"/><path d="M38 17 L28 6 L28 17Z" fill="#5b4540"/>' },
  { id:'pyramid', name:'Шатровая',    n:4, icon:'<rect x="9" y="15" width="24" height="13" fill="#d8d2c6"/><path d="M4 17 L21 3 L38 17Z" fill="#45322E"/><path d="M21 3 L21 17 L4 17Z" fill="#5b4540"/>' },
  { id:'gambrel', name:'Ломаная',     n:4, icon:'<rect x="9" y="16" width="24" height="12" fill="#d8d2c6"/><path d="M6 19 L10 9 L21 3 L32 9 L36 19 L33 19 L29.5 10.5 L21 6 L12.5 10.5 L9 19Z" fill="#45322E"/><path d="M9 17 L12.5 10.5 L21 6 L29.5 10.5 L33 17Z" fill="#d8d2c6"/>' },
];
const MATS = {
  tile:   { name:'Монтеррей', prof:0, per:0.1835, height:0.061 },
  cascade:{ name:'Каскад',    prof:3, per:0.183, height:0.045 },
  c21:    { name:'С21',       prof:1, per:0.100, height:0.021 },
  prof:   { name:'НС35',      prof:1, per:0.200, height:0.035 },
  falz:   { name:'Фальц',     prof:2, per:0.120, height:0.030 },
};
const COATS = {
  gloss:{ name:'Глянец',  r:0.27, m:0.16 },
  pural:{ name:'Пурал',   r:0.46, m:0.10 },
  matt: { name:'Матовый', r:0.91, m:0.05 },
};
const RAL = [
  ['3005','Винно-красный','#5E2129'],['3009','Оксидно-красный','#642424'],['3011','Коричнево-красный','#781F19'],
  ['8017','Шоколад','#45322E'],['8019','Серо-коричневый','#403A3A'],['8004','Медно-коричневый','#8E402A'],
  ['6005','Зелёный мох','#2F4538'],['6020','Хромовая зелень','#2E3A23'],['5005','Сигнальный синий','#154889'],
  ['7024','Графит','#474A51'],['7004','Сигнальный серый','#969992'],['9005','Чёрный','#0E0E10'],
  ['1014','Слоновая кость','#DDC49A'],['9003','Белый','#ECECE7'],
];
// kind: 0 штукатурка, 1 кирпич, 2 камень
const FACADE = [
  [0,'#F1EEE7','Белая штукатурка'],[0,'#E9DCC2','Штукатурка, слоновая кость'],[0,'#D5BF99','Штукатурка, песочный'],
  [0,'#BDBEB9','Штукатурка, серый'],[0,'#5E6266','Штукатурка, графит'],
  [1,'#9A4130','Красный кирпич'],[1,'#D9B97A','Жёлтый кирпич'],[1,'#6B3E2E','Коричневый кирпич'],
  [2,'#DDCCA5','Ракушечник'],[2,'#B4AFA3','Серый камень'],
];
const PLINTH = [['#8A8277','Серый'],['#4A4B4D','Графит'],['#6B5444','Коричневый'],['#B9A98C','Под камень']];
const GUTTER = [['roof','В цвет кровли',null],['9003','Белый','#ECECE7'],['8017','Коричневый','#45322E'],['7024','Графит','#474A51']];
const FRAMES = [['#F7F7F5','Белые'],['#3A3D42','Антрацит'],['#8A5A32','Золотой дуб']];
const SLIDERS = [
  { k:'W', label:'Ширина дома',  min:5,   max:14,  step:0.5,  unit:' м' },
  { k:'L', label:'Длина дома',   min:5,   max:18,  step:0.5,  unit:' м' },
  { k:'H', label:'Высота стен',  min:2.6, max:7,   step:0.1,  unit:' м' },
  { k:'A', label:'Угол ската',   min:10,  max:55,  step:1,    unit:'°' },
  { k:'O', label:'Свес',         min:0.2, max:0.9, step:0.05, unit:' м' },
];

/* configuration helpers */
function encodeConfiguration(state, camera){
  return encodeURIComponent(JSON.stringify({v:1,state,camera}));
}
function decodeConfiguration(encoded){
  try {
    if(encoded.length > 12000) return null;
    const data = JSON.parse(decodeURIComponent(encoded));
    if(!data || data.v !== 1 || !data.state || typeof data.state !== 'object' || Array.isArray(data.state)) return null;
    const state = {};
    const enums = {type:['shed','gable','hip','pyramid','gambrel'],mat:['tile','cascade','c21','prof','falz'],coat:['gloss','pural','matt'],ridgeStyle:['round','rect'],ral:['3005','3009','3011','8017','8019','8004','6005','6020','5005','7024','7004','9005','1014','9003'],gutCol:['roof','9003','8017','7024']};
    const ranges = {W:[5,14],L:[5,18],H:[2.6,7],A:[10,55],O:[.2,.9],facade:[0,9],plinth:[0,3],frames:[0,2],hour:[6.5,19.5],skyN:[0,3],skyPos:[.2,.8]};
    for(const [key,value] of Object.entries(data.state)){
      if(Object.hasOwn(enums,key) && enums[key].includes(value)) state[key]=value;
      if(Object.hasOwn(ranges,key) && typeof value === 'number' && Number.isFinite(value)){
        const [lo,hi]=ranges[key];
        if(value>=lo && value<=hi && (!['facade','plinth','frames','skyN'].includes(key) || Number.isInteger(value))) state[key]=value;
      }
      if(['trims','snow','gutter','trees'].includes(key) && typeof value === 'boolean') state[key]=value;
    }
    const skylights = data.state.skylights;
    if(skylights && typeof skylights === 'object' && !Array.isArray(skylights)){
      state.skylights = Object.fromEntries(Object.entries(skylights).filter(([key, point]) =>
        /^[0-3]:[0-2]$/.test(key) && Array.isArray(point) && point.length === 2 &&
        point.every(n => Number.isFinite(n) && Math.abs(n) <= 50)));
    }
    const vector = a => Array.isArray(a) && a.length===3 && a.every(n=>typeof n==='number' && Number.isFinite(n) && Math.abs(n)<=200);
    let camera = null;
    if(data.camera && vector(data.camera.position) && vector(data.camera.target)){
      const distance=Math.hypot(...data.camera.position.map((n,i)=>n-data.camera.target[i]));
      if(distance>=5 && distance<=150) camera={position:data.camera.position,target:data.camera.target};
    }
    return {state,camera};
  } catch { return null; }
}
/* end configuration helpers */
const savedConfiguration = location.hash.startsWith('#roof=') ? decodeConfiguration(location.hash.slice(6)) : null;
if(savedConfiguration) Object.assign(S, savedConfiguration.state);

/* ================= сцена ================= */
const canvas = document.getElementById('c');
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe0ee, 50, 150);
const pmrem = new THREE.PMREMGenerator(renderer);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 150;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 1.4;

const hemi = new THREE.HemisphereLight(0xe5efff, 0x8a806b, 0.38);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-22, right:22, top:22, bottom:-22, near:1, far:120 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;

function setTime(h, withEnv){
  needsRender=true;
  const k = (h - 6) / 14;
  const elev = Math.max(3, Math.sin(Math.PI * k) * 60) * Math.PI / 180;
  const az = (-115 + 230 * k) * Math.PI / 180;
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(elev), Math.sin(elev), Math.cos(az) * Math.cos(elev)).normalize();
  const low = 1 - THREE.MathUtils.smoothstep(elev * 180 / Math.PI, 4, 28);
  sun.position.copy(dir).multiplyScalar(50);
  sun.color.copy(lerpC('#fff3e2', '#ffab66', low));
  sun.intensity = 2.6 - 1.4 * low;
  skyU.uSunDir.value.copy(dir);
  skyU.uZen.value.copy(lerpC('#3f7cc4', '#40547f', low));
  skyU.uHor.value.copy(lerpC('#cfe2f2', '#f2b689', low));
  skyU.uSunCol.value.copy(lerpC('#fff4e0', '#ffa45c', low));
  scene.fog.color.copy(skyU.uHor.value);
  hemi.intensity = 0.38 - 0.17 * low;
  if(withEnv) regenEnv();
}

/* ---------- материал кровли: процедурный профиль ---------- */
const U = { uProfile:{ value:0 }, uPer:{ value:MATS.tile.per }, uHeight:{ value:MATS.tile.height }, uViewportHeight:{ value:1 }, uMatteTexture:{ value:false } };
const FRAG_HEAD = NOISE + `
uniform int uProfile;
uniform float uPer;
uniform float uHeight;
uniform bool uMatteTexture;
varying vec3 vSU;
varying vec3 vSV;
varying vec2 vM;
varying float vReliefFade;
float hTile(vec2 p){
  float wave = pow(0.5+0.5*cos(6.2831853*p.x/uPer),2.35);
  float row = fract(p.y/0.35);
  float stepProfile = smoothstep(0.0,0.018,row)*(1.0-smoothstep(0.018,1.0,row));
  return 0.036*wave + 0.025*stepProfile;
}
float trapezoid(float d, float top, float foot){
  return clamp((foot-d)/(foot-top),0.0,1.0);
}
float hProf(vec2 p){
  float d = abs(fract(p.x/uPer)-0.5)*uPer;
  return uHeight*trapezoid(d,uPer<0.15 ? 0.0175 : 0.035,uPer<0.15 ? 0.0325 : 0.055);
}
float hCascade(vec2 p){
  float d = abs(fract(p.x/uPer)-0.5)*uPer;
  float rib = trapezoid(d,0.055,0.074);
  float row = fract(p.y/0.35);
  float stepProfile = min(row/0.016,(1.0-row)/0.984);
  return 0.025*rib + 0.020*stepProfile;
}
float cascadeGrooveDistance(float u){
  float d = abs(fract(u/uPer)-0.5)*uPer;
  return min(abs(d-0.014),abs(d-0.037));
}
float hFalz(vec2 p){
  float t = fract(p.x/0.55);
  float d = min(t,1.0-t)*0.55;
  float r = 1.0 - smoothstep(0.0,0.04,d);
  return 0.03*r*r;
}
float hgt(vec2 p){
  if(uProfile==0) return hTile(p);
  if(uProfile==1) return hProf(p);
  if(uProfile==3) return hCascade(p);
  return hFalz(p);
}
// The pattern is fixed in metres on the roof and filtered at grazing angles.
vec3 matteTexture(vec2 uv, vec2 footprint){
  const float grainScale = 75.0;
  const float fineScale = 155.0;
  float pixelSize = max(footprint.x,footprint.y);
  float grainFade = 1.0-smoothstep(0.18,0.68,pixelSize*grainScale);
  if(grainFade<=0.0) return vec3(0.0);

  vec2 p = uv*grainScale;
  float baseGrain = (vnoise(p)-0.5)*grainFade;
  float fineFade = 1.0-smoothstep(0.18,0.68,pixelSize*fineScale);
  float fineGrain = (vnoise(uv*fineScale+vec2(19.0,7.0))-0.5)*fineFade;
  vec2 e = clamp(0.5*footprint*grainScale,vec2(0.08),vec2(0.35));
  vec2 grainSlope = vec2(
    (vnoise(p+vec2(e.x,0.0))-vnoise(p-vec2(e.x,0.0)))/(2.0*e.x),
    (vnoise(p+vec2(0.0,e.y))-vnoise(p-vec2(0.0,e.y)))/(2.0*e.y)
  );
  return vec3(0.13*baseGrain+0.08*fineGrain,0.065*grainFade*grainSlope);
}
bool stampedTile(){ return uProfile==0 || uProfile==3; }
vec2 roofDetailFade(){
  vec2 footprint = fwidth(vM);
  // Transverse steps are much narrower than the spacing between courses.
  vec2 detail = 1.0 - smoothstep(vec2(uPer*0.025,0.003),vec2(uPer*0.14,0.025),footprint);
  return stampedTile() ? detail*vec2(mix(0.42,1.0,vReliefFade),vReliefFade) : detail;
}
`;
const roofMat = new THREE.MeshPhysicalMaterial({ color:'#45322E', roughness:.3, metalness:.16, clearcoat:.32, clearcoatRoughness:.22, side:THREE.FrontSide, envMapIntensity:.65 });
roofMat.onBeforeCompile = (sh) => {
  sh.uniforms.uProfile = U.uProfile;
  sh.uniforms.uPer = U.uPer;
  sh.uniforms.uHeight = U.uHeight;
  sh.uniforms.uViewportHeight = U.uViewportHeight;
  sh.uniforms.uMatteTexture = U.uMatteTexture;
  sh.vertexShader = `
    attribute vec3 slopeU;
    attribute vec3 slopeV;
    attribute vec2 aM;
    attribute float reliefHeight;
    uniform int uProfile;
    uniform float uViewportHeight;
    varying vec3 vSU;
    varying vec3 vSV;
    varying vec2 vM;
    varying float vReliefFade;
  ` + sh.vertexShader
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vReliefFade = 1.0;
      if(uProfile==0 || uProfile==3){
        vec3 basePosition = position - normal*reliefHeight;
        vec3 eyePosition = (modelViewMatrix*vec4(basePosition,1.0)).xyz;
        float incidence = abs(dot(normalize(normalMatrix*normal),normalize(eyePosition)));
        float pixelsPerMetre = 0.5*uViewportHeight*projectionMatrix[1][1]/max(-eyePosition.z,0.1);
        float courseFacePixels = 0.006*pixelsPerMetre*incidence;
        vReliefFade = smoothstep(0.35,1.2,courseFacePixels)*smoothstep(0.18,0.44,incidence);
        transformed = basePosition + normal*(reliefHeight*vReliefFade);
      }
      vSU = normalize(normalMatrix*slopeU);
      vSV = normalize(normalMatrix*slopeV);
      vM = aM;
    `);
  sh.fragmentShader = FRAG_HEAD + sh.fragmentShader
    .replace('#include <color_fragment>', `#include <color_fragment>
      vec2 coatingFootprint = fwidth(vM);
      vec3 coatingGrain = uMatteTexture ? matteTexture(vM,coatingFootprint) : vec3(0.0);
      diffuseColor.rgb *= 1.0+coatingGrain.x;
      {
        vec2 fade = roofDetailFade();
        float hN = hgt(vM)/uHeight;
        if(uProfile==3){
          float row=fract(vM.y/0.35);
          float crease=smoothstep(0.0,0.012,row)*(1.0-smoothstep(0.018,0.055,row));
          float pixel=fwidth(vM.x);
          float groove=1.0-smoothstep(0.0008,0.0022+pixel*0.5,cascadeGrooveDistance(vM.x));
          float grooveFade=1.0-smoothstep(0.002,0.008,pixel);
          diffuseColor.rgb *= 1.0 - 0.19*crease*fade.y - 0.12*groove*grooveFade*vReliefFade;
        } else if(stampedTile()){
          float row=fract(vM.y/0.35);
          float crease=(1.0-smoothstep(0.018,0.062,row))*smoothstep(0.0,0.01,row);
          diffuseColor.rgb *= 1.0 - 0.19*crease*fade.y;
        } else diffuseColor.rgb *= mix(0.9, mix(0.76,1.0,hN), fade.x);
        if(uProfile==3){
          float row=fract(vM.y/0.35);
          float band=1.0-smoothstep(0.0,0.16,min(row,1.0-row));
          float bandFade=1.0-smoothstep(0.018,0.065,fwidth(vM.y));
          diffuseColor.rgb *= 1.0-0.075*band*bandFade*(1.0-vReliefFade);
        }
      }`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      {
        vec2 fade = roofDetailFade();
        float resolved = stampedTile() ? min(fade.x,fade.y) : fade.x;
        roughnessFactor = mix(max(roughnessFactor,0.40),roughnessFactor,resolved);
        if(stampedTile()) roughnessFactor = max(roughnessFactor,mix(0.36,0.47,1.0-resolved));
      }`)
    .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      {
        // Average the height slope over the pixel footprint instead of sampling the sharp edge.
        vec2 e = stampedTile() ? clamp(0.65*fwidth(vM),vec2(0.003,0.005),vec2(0.024,0.026)) : vec2(0.0025);
        vec2 fade = roofDetailFade();
        float hu = (hgt(vM+vec2(e.x,0.0)) - hgt(vM-vec2(e.x,0.0)))/(2.0*e.x);
        float hv = (hgt(vM+vec2(0.0,e.y)) - hgt(vM-vec2(0.0,e.y)))/(2.0*e.y);
        float strength=stampedTile() ? 0.68 : (uProfile==2 ? 1.6 : 1.0);
        vec2 slope = vec2(hu,hv)*fade*strength+coatingGrain.yz;
        normal = normalize(normal - (slope.x*normalize(vSU) + slope.y*normalize(vSV))*faceDirection);
      }`)
    .replace('#include <clearcoat_normal_fragment_maps>', `#include <clearcoat_normal_fragment_maps>
      #ifdef USE_CLEARCOAT
        if(stampedTile()) clearcoatNormal = normalize(mix(clearcoatNormal,normal,0.30));
        else if(uProfile!=2) clearcoatNormal = normal;
      #endif
    `)
    .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
      #ifdef USE_CLEARCOAT
        if(stampedTile()) material.clearcoatRoughness = max(material.clearcoatRoughness,0.44);
      #endif
    `)
    .replace('#include <opaque_fragment>', `
      if(uProfile==0){
        // Filter the course edge after lighting so the gloss highlight keeps the row visible.
        float footprint=fwidth(vM.y);
        float crest=hTile(vec2(vM.x,0.0))/0.036;
        float row=fract(vM.y/0.35-0.018-0.032*crest*(1.0-vReliefFade));
        float distanceToStep=min(row,1.0-row);
        float feather=max(0.085,footprint/0.35);
        float stepShade=1.0-smoothstep(0.0,feather,distanceToStep);
        float resolved=1.0-smoothstep(0.020,0.070,footprint);
        outgoingLight *= 1.0-mix(0.30,0.12,vReliefFade)*stepShade*resolved;
      }
      #include <opaque_fragment>
    `);
};
