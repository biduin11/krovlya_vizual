/* ================= геометрия ================= */
const Y = new THREE.Vector3(0,1,0);
function newell(pts){
  const n = new THREE.Vector3();
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    n.x += (a.y-b.y)*(a.z+b.z); n.y += (a.z-b.z)*(a.x+b.x); n.z += (a.x-b.x)*(a.y+b.y);
  }
  return n;
}

// скат: оси U (вдоль карниза) и V (вверх по линии стока)
function slopeGeometry(ptsIn){
  let pts = ptsIn;
  const nRaw = newell(pts);
  const area = nRaw.length()/2;
  const n = nRaw.clone().normalize();
  if(n.y < 0){ pts = pts.slice().reverse(); n.negate(); }
  const Uv = new THREE.Vector3().crossVectors(n, Y).normalize();
  const Vv = new THREE.Vector3().crossVectors(n, Uv);
  if(Vv.y < 0){ Uv.negate(); Vv.negate(); }
  let o = pts[0]; for(const p of pts) if(p.y < o.y) o = p;
  o = o.clone();
  const uv = pts.map(p => { const d = p.clone().sub(o); return [d.dot(Uv), d.dot(Vv)]; });
  const pos=[], nor=[], su=[], sv=[], m=[];
  const push = (i) => {
    const p = pts[i];
    pos.push(p.x,p.y,p.z); nor.push(n.x,n.y,n.z);
    su.push(Uv.x,Uv.y,Uv.z); sv.push(Vv.x,Vv.y,Vv.z); m.push(uv[i][0], uv[i][1]);
  };
  for(let i=1;i<pts.length-1;i++){ push(0); push(i); push(i+1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('slopeU',   new THREE.Float32BufferAttribute(su,3));
  g.setAttribute('slopeV',   new THREE.Float32BufferAttribute(sv,3));
  g.setAttribute('aM',       new THREE.Float32BufferAttribute(m,2));
  g.setAttribute('reliefHeight', new THREE.Float32BufferAttribute(new Float32Array(pos.length/3),1));
  const centroid = pts.reduce((c,p) => c.add(p), new THREE.Vector3()).multiplyScalar(1/pts.length);
  return { g, area, pts, uv, n, U:Uv, V:Vv, o, centroid };
}

/* tile profile */
// Metres: pressed wave + a short upstand at each 350 mm course.
// Keep in sync with hTile in the fragment shader.
function tileHeight(u,v){
  const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
  const wave=Math.pow(.5+.5*Math.cos(2*Math.PI*u/.1835),2.35);
  const row=((v/.35)%1+1)%1;
  const step=smooth(0,.018,row)*(1-smooth(.018,1,row));
  return .036*wave+.025*step;
}
/* end tile profile */

// Match the GLSL profiles so highlights follow the displaced surface.
function roofProfileHeight(u,v,material){
  if(material.prof===0) return tileHeight(u,v);
  const d = Math.abs(((u/material.per)%1+1)%1-0.5)*material.per;
  const trapezoid = (top,foot) => Math.max(0,Math.min(1,(foot-d)/(foot-top)));
  if(material.prof===1){
    return material.per<0.15 ? material.height*trapezoid(0.0175,0.0325) : material.height*trapezoid(0.035,0.055);
  }
  const row = ((v/.35)%1+1)%1;
  const step = Math.min(row/0.016,(1-row)/0.984);
  return 0.025*trapezoid(0.055,0.074)+0.020*step;
}

function roofReliefGeometry(s, material, quality='overview'){
  const detailed = quality==='detail';
  const straight = material.prof===1;
  // For profiled sheets, slice parallel to the ribs so they stay straight on hips.
  const section = straight ? {uv:s.uv.map(([u,v]) => [v,u])} : s;
  const low = Math.min(...section.uv.map(p=>p[1]));
  const high = Math.max(...section.uv.map(p=>p[1]));
  const left = Math.min(...section.uv.map(p=>p[0]));
  const right = Math.max(...section.uv.map(p=>p[0]));
  const heights = new Set(section.uv.map(p=>p[1]));
  const pitch = straight ? material.per : 0.35;
  const fractions = straight
    ? (pitch < 0.15 ? [0.175,0.325,0.675,0.825] : [0.225,0.325,0.675,0.775])
    : material.prof===3 ? [0,.016,.5]
    : detailed ? [0,.006,.012,.018,.05,.10,.20,.40,.65,.88] : [0,.006,.018,.10,.40,.70];
  for(let row=Math.floor(low/pitch);row*pitch<high;row++) for(const fraction of fractions){
    const v=(row+fraction)*pitch;
    if(v>low && v<high) heights.add(v);
  }
  const rows=[...heights].sort((a,b)=>a-b).filter((v,i,a)=>i===0 || v-a[i-1]>1e-7);
  // Черепица: не больше 32 000 треугольников на скат в общем виде и 96 000 вблизи.
  const budget = detailed ? 96000 : 32000;
  const columns = straight ? 1 : Math.max(1,Math.min(Math.ceil((right-left)/(material.per/(detailed?12:6))),Math.floor(budget/(2*Math.max(1,rows.length-1)))));
  const pos=[],nor=[],su=[],sv=[],meters=[],relief=[],indices=[];
  for(const row of rows){
    const [lo,hi]=spanAt(section,row);
    for(let col=0;col<=columns;col++){
      let sample;
      if(col===0) sample=lo;
      else if(col===columns) sample=hi;
      else sample=Math.max(lo,Math.min(hi,left+(right-left)*col/columns));
      const [u,v]=straight ? [row,sample] : [sample,row];
      const h=roofProfileHeight(u,v,material);
      relief.push(h);
      pos.push(s.o.x+s.U.x*u+s.V.x*v+s.n.x*h,s.o.y+s.U.y*u+s.V.y*v+s.n.y*h,s.o.z+s.U.z*u+s.V.z*v+s.n.z*h);
      nor.push(s.n.x,s.n.y,s.n.z);su.push(s.U.x,s.U.y,s.U.z);sv.push(s.V.x,s.V.y,s.V.z);meters.push(u,v);
    }
  }
  for(let row=0;row<rows.length-1;row++) for(let col=0;col<columns;col++){
    const a=row*(columns+1)+col,b=a+1,c=a+columns+1,d=c+1;
    if(straight) indices.push(a,d,b,a,c,d);
    else indices.push(a,b,d,a,d,c);
  }
  const g=new THREE.BufferGeometry();
  for(const [name,data,size] of [['position',pos,3],['normal',nor,3],['slopeU',su,3],['slopeV',sv,3],['aM',meters,2],['reliefHeight',relief,1]]) g.setAttribute(name,new THREE.Float32BufferAttribute(data,size));
  g.setIndex(indices);g.computeBoundingSphere();
  return g;
}

function flatGeometry(pts){
  const n = newell(pts).normalize();
  const pos=[], nor=[];
  for(let i=1;i<pts.length-1;i++) for(const p of [pts[0],pts[i],pts[i+1]]){ pos.push(p.x,p.y,p.z); nor.push(n.x,n.y,n.z); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  return g;
}

function rod(a, b, r, mat, seg=12){
  const dir = b.clone().sub(a); const len = dir.length();
  if(len < 0.005) return null;
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(Y, dir.normalize());
  mesh.castShadow = true;
  return mesh;
}
function orientedBox(lx, ly, lz, X, Yv, center, mat){
  const x = X.clone().normalize();
  const z = new THREE.Vector3().crossVectors(x, Yv).normalize();
  const y = new THREE.Vector3().crossVectors(z, x).normalize();
  const m = new THREE.Mesh(new THREE.BoxGeometry(lx, ly, lz), mat);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  m.position.copy(center); m.castShadow = true;
  return m;
}

// Листовые профили: поперечное сечение в горизонтали и по высоте.
function sheetProfile(profile, a, b, across, material, {endShift = [0, 0], up = Y} = {}){
  const shape = new THREE.Shape(profile.map(([x,y]) => new THREE.Vector2(x,y)));
  const length = a.distanceTo(b);
  const g = new THREE.ExtrudeGeometry(shape, {depth:length, bevelEnabled:false});
  const position = g.getAttribute('position');
  for(let i=0;i<position.count;i++){
    const x = position.getX(i), z = position.getZ(i);
    position.setZ(i, z + x*endShift[z > length/2 ? 1 : 0]);
  }
  const along = b.clone().sub(a).normalize();
  g.applyMatrix4(new THREE.Matrix4().makeBasis(across, up, along).setPosition(a));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, material);
  mesh.castShadow = mesh.receiveShadow = true;
  house.add(mesh);
}

// Штампованные рёбра огибают верх конька и выходят на боковые полки.
function addRidgeBeads(profile, a, b, across, up){
  const length = a.distanceTo(b);
  if(length < 0.12) return;
  const along = b.clone().sub(a).normalize();
  const pitch = 0.316;
  const halfWidth = 0.018;
  const margin = 0.05;
  const count = Math.floor((length-2*margin)/pitch)+1;
  const first = (length-(count-1)*pitch)/2;
  const sections = 8;
  const positions = [], indices = [];
  const contour = profile.map(([x,y],i) => {
    const prev = profile[Math.max(0,i-1)], next = profile[Math.min(profile.length-1,i+1)];
    const tangentX = next[0]-prev[0], tangentY = next[1]-prev[1];
    const span = Math.hypot(tangentX,tangentY);
    return {x,y,nx:-tangentY/span,ny:tangentX/span};
  });

  for(let rib=0;rib<count;rib++){
    const center = first+rib*pitch;
    const start = positions.length/3;
    for(let row=0;row<=sections;row++){
      const fraction = 2*row/sections-1;
      const z = center+halfWidth*fraction;
      const height = 0.010*Math.cos(fraction*Math.PI/2)**2-0.0015;
      for(const [i,{x,y,nx,ny}] of contour.entries()){
        const u = x+height*nx, v = y+height*ny;
        positions.push(u,v,z);
        if(row<sections && i<contour.length-1){
          const p = start+row*contour.length+i;
          const q = p+contour.length;
          indices.push(p,q,p+1,p+1,q,q+1);
        }
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geometry.setIndex(indices);
  geometry.applyMatrix4(new THREE.Matrix4().makeBasis(across,up,along).setPosition(a));
  geometry.computeVertexNormals();
  const beads = new THREE.Mesh(geometry,trimMat);
  beads.castShadow = beads.receiveShadow = true;
  house.add(beads);
}

function addRidgeCap(a, b, slopes){
  const along = b.clone().sub(a).normalize();
  const across = new THREE.Vector3().crossVectors(Y, along).normalize();
  const up = new THREE.Vector3().crossVectors(along, across);
  const center = a.clone().lerp(b, 0.5);
  const side = sign => slopes.find(s => sign*across.dot(s.centroid.clone().sub(center)) > 0);
  const slopeSection = sign => {
    const slope = side(sign);
    const normalUp = slope ? slope.n.dot(up) : 1;
    const grade = slope ? -slope.n.dot(across)/normalUp : 0;
    const clearance = slope ? Math.max(0.060, MATS.tile.height/normalUp+0.009) : 0.060;
    return {slope, grade, clearance, normalUp};
  };
  const left = slopeSection(-1), right = slopeSection(1);
  // Оформление конька применяется там, где скаты расходятся вниз.
  const isRidge = slopes.length === 2 && left.grade >= 0 && right.grade <= 0;
  const rectangular = isRidge && S.ridgeStyle==='rect';
  const rounded = isRidge && !rectangular;
  const halfWidth = 0.0825, crownHeight = 0.075;
  const ridgeFlatHalfWidth = 0.015;
  const flange = ({slope,grade,clearance}, sign) => {
    const gradeFactor = Math.hypot(1,grade);
    let reach = 0.23/gradeFactor;
    if(rectangular) reach = ridgeFlatHalfWidth+0.115/gradeFactor;
    const x = sign*(slope ? reach : 0.055);
    const y = x*grade;
    return [[x,y+(slope ? clearance-0.019 : -0.075)], [x,y+clearance]];
  };
  const base = Math.max(left.clearance,right.clearance)+0.005;
  let crown = [[0,base]];
  // Measure clearance perpendicular to each slope, including the tallest roofing relief.
  const ridgeClearance = MATS.tile.height+0.007;
  const seat = (section, x) => x*section.grade + ridgeClearance/section.normalUp;
  if(rounded){
    const leftSeat = seat(left,-halfWidth), rightSeat = seat(right,halfWidth);
    const rise = Math.max(crownHeight,base-(leftSeat+rightSeat)/2);
    crown = Array.from({length:37}, (_, i) => {
      const angle = Math.PI*(1-i/36);
      const x = halfWidth*Math.cos(angle);
      const springline = leftSeat+(rightSeat-leftSeat)*(x+halfWidth)/(2*halfWidth);
      return [x,springline+rise*Math.sin(angle)];
    });
  }
  if(rectangular){
    const x = ridgeFlatHalfWidth, top = base+0.025;
    crown = [
      [-x,left.clearance-x*left.grade], [-x,top],
      [x,top], [x,right.clearance+x*right.grade]
    ];
  }
  const profile = rounded
    ? [[-0.1125,seat(left,-0.1125)], ...crown, [0.1125,seat(right,0.1125)]]
    : [...flange(left,-1), ...crown, ...flange(right,1).reverse()];
  const thickness = rounded ? 0.002 : 0.008;
  const shell = points => [...points, ...points.slice().reverse().map(([x,y]) =>
    [x-Math.sign(x)*thickness, y-thickness])];
  if(rounded){
    const drop = 0.005;
    const start = a.clone().addScaledVector(Y,-drop);
    const end = b.clone().addScaledVector(Y,-drop);
    sheetProfile(shell(profile), start, end, across, trimMat, {up});
    addRidgeBeads(profile, start, end, across, up);
    return;
  }
  sheetProfile(shell(profile), a, b, across, trimMat, {up});
  const length = a.distanceTo(b);
  const sections = Math.ceil(length/2);
  const lap = shell(profile.map(([x,y]) => [x*1.02,y+0.01]));
  for(let i=1;i<sections;i++){
    const point = a.clone().lerp(b, i/sections);
    sheetProfile(lap, point, point.clone().addScaledVector(along, 0.035), across, trimMat, {up});
  }
}

const gutterRadius = 0.085, gutterThickness = 0.008, pipeRadius = 0.048;
function gutterProfile(radius, thickness){
  const arc = (r, reverse) => Array.from({length:17}, (_, i) => {
    const angle = Math.PI*(reverse ? 16-i : i)/16;
    return [r*Math.cos(angle), -r*Math.sin(angle)];
  });
  return [...arc(radius, false), ...arc(radius-thickness, true)];
}

function addGutter(e, eaves, overhang){
  // Keep the inner lip under the roof edge so runoff lands inside the channel.
  const center = p => p.clone().addScaledVector(e.out, 0.055).addScaledVector(Y, -0.045);
  const along = new THREE.Vector3().crossVectors(e.out, Y);
  const forward = along.dot(e.b.clone().sub(e.a)) > 0;
  const [start,end] = forward ? [e.a,e.b] : [e.b,e.a];
  const a = center(start), b = center(end);
  const mate = p => eaves.find(other => other !== e && (p.equals(other.a) || p.equals(other.b)));
  const joints = [mate(start), mate(end)];
  const endShift = joints.map(other => other ? along.dot(other.out) : 0);
  a.addScaledVector(along, 0.055*endShift[0]);
  b.addScaledVector(along, 0.055*endShift[1]);
  sheetProfile(gutterProfile(gutterRadius, gutterThickness), a, b, e.out, gutterMat, {endShift});
  for(const x of [-gutterRadius+0.009, gutterRadius-0.009]){
    const lipPoint = (p, i) => p.clone().addScaledVector(e.out, x).addScaledVector(along, x*endShift[i]);
    house.add(rod(lipPoint(a,0), lipPoint(b,1), 0.009, gutterMat, 8));
  }
  const endCap = gutterProfile(gutterRadius,gutterThickness).slice(0,17);
  if(!joints[0]) sheetProfile(endCap, a, a.clone().addScaledVector(along, 0.012), e.out, gutterMat);
  if(!joints[1]) sheetProfile(endCap, b.clone().addScaledVector(along, -0.012), b, e.out, gutterMat);

  const fascia = start.clone().lerp(end, 0.5).addScaledVector(e.out,-0.024).addScaledVector(Y,-0.075);
  house.add(orientedBox(e.len,0.13,0.035,along,Y,fascia,trimMat));

  const brackets = Math.ceil(e.len/0.95);
  const saddle = gutterProfile(gutterRadius+0.011, 0.012);
  for(let i=0;i<brackets;i++){
    const point = center(start).addScaledVector(along, e.len*(i+0.5)/brackets);
    sheetProfile(saddle, point, point.clone().addScaledVector(along, 0.03), e.out, gutterMat);
  }
  const outlet = overhang+0.52;
  addDownspout(center(start).addScaledVector(along, outlet), e.out, overhang);
  if(e.len > 12) addDownspout(center(end).addScaledVector(along, -outlet), e.out, overhang);
}

function addDownspout(gutter, out, overhang){
  const top = gutter.clone().addScaledVector(Y, -gutterRadius+0.035);
  const neck = top.clone().addScaledVector(Y, -0.14);
  const bend = neck.clone().addScaledVector(Y, -0.14);
  const wall = bend.clone().addScaledVector(out, -(overhang+0.055-0.12));
  wall.y -= Math.max(0.22, (overhang-0.065)*0.64);
  const foot = wall.clone(); foot.y = 0.40;
  const exit = foot.clone().addScaledVector(out, 0.23).addScaledVector(Y,-0.125);
  if(wall.y <= foot.y+0.18) return;

  const funnel = new THREE.Mesh(new THREE.CylinderGeometry(0.066, pipeRadius+0.006, 0.14, 20, 1, true), gutterMat);
  funnel.position.copy(top).lerp(neck,0.5);
  funnel.castShadow = true;
  house.add(funnel);

  const path = new THREE.CurvePath();
  let from = neck;
  const corners = [bend, wall, foot];
  const couplings = [[neck,Y]];
  for(const [i,corner] of corners.entries()){
    const next = corners[i+1] || exit;
    const tangent = corner.clone().sub(from).normalize();
    const before = corner.clone().addScaledVector(tangent, -0.09);
    const after = corner.clone().addScaledVector(next.clone().sub(corner).normalize(), 0.09);
    path.add(new THREE.LineCurve3(from, before));
    path.add(new THREE.QuadraticBezierCurve3(before, corner, after));
    couplings.push([before,tangent]);
    from = after;
  }
  path.add(new THREE.LineCurve3(from, exit));
  const pipe = new THREE.Mesh(new THREE.TubeGeometry(path, Math.ceil(path.getLength()*32), pipeRadius, 16), gutterMat);
  pipe.castShadow = pipe.receiveShadow = true;
  house.add(pipe);

  const pipeRing = (point, tangent, radius, thickness) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, thickness, 6, 20), gutterMat);
    ring.position.copy(point);
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), tangent);
    house.add(ring);
  };
  for(const [point,tangent] of couplings) pipeRing(point, tangent, pipeRadius, 0.006);
  const direction = exit.clone().sub(foot).normalize();
  const mouth = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius-0.005, pipeRadius-0.005, 0.075, 16, 1, true),
    gutterMat);
  mouth.geometry.scale(-1,1,1);
  mouth.geometry.computeVertexNormals();
  mouth.position.copy(exit).addScaledVector(direction,-0.037);
  mouth.quaternion.setFromUnitVectors(Y,direction);
  house.add(mouth);
  pipeRing(exit, direction, pipeRadius-0.001, 0.005);

  const count = Math.ceil((wall.y-0.80)/1.55);
  for(let i=0;i<count;i++){
    const point = wall.clone();
    point.y = 0.68+(wall.y-0.80)*(i+0.5)/count;
    const band = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius+0.009, pipeRadius+0.009, 0.032, 16, 1, true), gutterMat);
    band.position.copy(point);
    house.add(band, orientedBox(0.055, 0.048, 0.095, new THREE.Vector3().crossVectors(Y,out), Y,
      point.clone().addScaledVector(out,-0.074), gutterMat));
  }
}

// Модель крыши в локальных осях: p — поперёк короткой стороны, q — вдоль длинной
function roofModel(){
  const { W, L, H } = S;
  // Retain the requested wall height and slope: constrain the horizontal overhang.
  const lowerTangent=Math.tan(Math.min(75,S.A+35)*Math.PI/180);
  const maxOverhang=S.type==='gambrel' ? Math.max(.2,Math.min(.9,Math.floor(((H-1.8)/lowerTangent+1e-9)*20)/20)) : .9;
  const O=Math.min(S.O,maxOverhang);
  const t = Math.tan(S.A*Math.PI/180);
  const short = Math.min(W,L), long = Math.max(W,L);
  const swap = W > L;
  const P0 = (p,y,q) => swap ? new THREE.Vector3(q,y,p) : new THREE.Vector3(p,y,q);
  const P = P0;
  const a = short/2 + O, b = long/2 + O, hs = short/2, hl = long/2;
  const slopes=[], walls=[], ridges=[];
  let y0 = H - O*t, pitchText = `${S.A}°`;
  switch(S.type){
    case 'shed': {
      const yh = y0 + 2*a*t;
      const P = (p,y,q) => P0(-p,y,q); // низкий карниз — к камере
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(a,yh,b),P(a,yh,-b)]);
      for(const q of [-hl,hl]) walls.push([P(-hs,H,q),P(hs,H,q),P(hs,H+short*t,q)]);
      walls.push([P(hs,H,-hl),P(hs,H,hl),P(hs,H+short*t,hl),P(hs,H+short*t,-hl)]);
      ridges.push([P(a,yh,-b),P(a,yh,b)]);
      break;
    }
    case 'gable': {
      const yr = y0 + a*t;
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(0,yr,b),P(0,yr,-b)]);
      slopes.push([P(a,y0,-b),P(0,yr,-b),P(0,yr,b),P(a,y0,b)]);
      for(const q of [-hl,hl]) walls.push([P(-hs,H,q),P(hs,H,q),P(0,H+hs*t,q)]);
      ridges.push([P(0,yr,-b),P(0,yr,b)]);
      break;
    }
    case 'hip': {
      const yr = y0 + a*t, r = b - a;
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(0,yr,r),P(0,yr,-r)]);
      slopes.push([P(a,y0,b),P(a,y0,-b),P(0,yr,-r),P(0,yr,r)]);
      slopes.push([P(-a,y0,b),P(a,y0,b),P(0,yr,r)]);
      slopes.push([P(a,y0,-b),P(-a,y0,-b),P(0,yr,-r)]);
      if(r > 0.01) ridges.push([P(0,yr,-r),P(0,yr,r)]);
      for(const [sp,sq,rq] of [[-1,1,r],[1,1,r],[-1,-1,-r],[1,-1,-r]]) ridges.push([P(sp*a,y0,sq*b),P(0,yr,rq)]);
      break;
    }
    case 'pyramid': {
      const yr = y0 + a*t, apex = P(0,yr,0);
      const c = [P(-a,y0,-b),P(-a,y0,b),P(a,y0,b),P(a,y0,-b)];
      for(let i=0;i<4;i++){ slopes.push([c[i],c[(i+1)%4],apex]); ridges.push([c[i],apex]); }
      if(Math.abs(long-short) > 0.01) pitchText = `${S.A}° / ${Math.round(Math.atan((yr-y0)/b)*180/Math.PI)}°`;
      break;
    }
    case 'gambrel': {
      const beta = Math.min(75, S.A + 35)*Math.PI/180, tb = Math.tan(beta);
      y0 = H - O*tb;
      let d = Math.max(O + 0.35, a*0.32); d = Math.min(d, a - 0.6);
      const yb = y0 + d*tb, k = a - d, yr = yb + k*t;
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(-k,yb,b),P(-k,yb,-b)]);
      slopes.push([P(-k,yb,-b),P(-k,yb,b),P(0,yr,b),P(0,yr,-b)]);
      slopes.push([P(a,y0,b),P(a,y0,-b),P(k,yb,-b),P(k,yb,b)]);
      slopes.push([P(k,yb,b),P(k,yb,-b),P(0,yr,-b),P(0,yr,b)]);
      for(const q of [-hl,hl]) walls.push([P(-hs,H,q),P(hs,H,q),P(k,yb,q),P(0,yr,q),P(-k,yb,q)]);
      ridges.push([P(0,yr,-b),P(0,yr,b)]);
      ridges.push([P(-k,yb,-b),P(-k,yb,b)]);
      ridges.push([P(k,yb,-b),P(k,yb,b)]);
      pitchText = `${S.A}° / ${Math.round(beta*180/Math.PI)}°`;
      break;
    }
  }
  return { slopes, walls, ridges, y0, pitchText, effectiveOverhang:O, maxOverhang };
}

/* ================= сборка ================= */
const house = new THREE.Group();
const envGroup = new THREE.Group();
const roofSurfaceMeshes = [];
const skylightMeshes = [];
let tileQuality='overview';
let needsRender=true;
// Черепичные профили (Монтеррей, Каскад) имеют два уровня сетки; профнастил и фальц от него не зависят.
const qualityDependent = () => [0,3].includes(MATS[S.mat].prof);
function refreshRoofDetail(preferred){
  const ratio=camera.position.distanceTo(controls.target)/Math.max(S.W,S.L);
  const next=preferred || (ratio<1.4 ? 'detail' : ratio>2 ? 'overview' : tileQuality);
  if(next===tileQuality) return;
  tileQuality=next;
  if(!qualityDependent()) return;
  for(const {mesh,s} of roofSurfaceMeshes){
    mesh.geometry.dispose();mesh.geometry=roofReliefGeometry(s,MATS[S.mat],tileQuality);s.g=mesh.geometry;
  }
  needsRender=true;
}
let detailTimer;
controls.addEventListener('end',()=>{clearTimeout(detailTimer);detailTimer=setTimeout(()=>refreshRoofDetail(),180);});
scene.add(house, envGroup);

function clearGroup(g){ g.traverse(o => { if(o.geometry) o.geometry.dispose(); }); g.clear(); }

function addOpening(c, nrm, tan, off, y, w, h, kind){
  const base = c.clone().addScaledVector(tan, off); base.y = y;
  const look = (m, push) => { m.position.copy(base).addScaledVector(nrm, push); m.lookAt(m.position.clone().add(nrm)); house.add(m); };
  if(kind === 'door'){
    look(new THREE.Mesh(new THREE.PlaneGeometry(w+0.16, h+0.08), frameMat), 0.012);
    look(new THREE.Mesh(new THREE.PlaneGeometry(w, h), doorMat), 0.02);
    const handle=new THREE.Mesh(new THREE.BoxGeometry(.035,.22,.045),skyFrameMat);
    look(handle,.065);handle.position.addScaledVector(tan,w*.32);
    const canopy = new THREE.Mesh(new THREE.BoxGeometry(w+0.8, 0.06, 0.9), trimMat);
    canopy.position.copy(base).addScaledVector(nrm, 0.45); canopy.position.y = y + h/2 + 0.35;
    canopy.lookAt(canopy.position.clone().add(nrm)); canopy.castShadow = true; house.add(canopy);
    const step = new THREE.Mesh(new THREE.BoxGeometry(w+0.8, 0.3, 1.0), plinthMat);
    step.position.copy(base).addScaledVector(nrm, 0.5); step.position.y = 0.15;
    step.lookAt(step.position.clone().add(nrm)); step.castShadow = step.receiveShadow = true; house.add(step);
  } else {
    // Raised frame surrounds a recessed pane; real depth catches sun and shadow.
    look(new THREE.Mesh(new THREE.PlaneGeometry(w+0.16,h+0.16),frameMat),0.012);
    look(new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat),0.025);
    for(const x of [-w/2-.035,w/2+.035]){
      const frame=new THREE.Mesh(new THREE.BoxGeometry(.07,h+.16,.10),frameMat);
      look(frame,.055);frame.position.addScaledVector(tan,x);frame.castShadow=true;
    }
    for(const yOff of [-h/2-.035,h/2+.035]){
      const frame=new THREE.Mesh(new THREE.BoxGeometry(w,.07,.10),frameMat);
      look(frame,.055);frame.position.y+=yOff;frame.castShadow=true;
    }
    const mullion=new THREE.Mesh(new THREE.BoxGeometry(.055,h,.075),frameMat);
    look(mullion,.065);mullion.castShadow=true;
    const sill = new THREE.Mesh(new THREE.BoxGeometry(w+0.3, 0.05, 0.24), frameMat);
    sill.position.copy(base).addScaledVector(nrm, 0.07); sill.position.y = y - h/2 - 0.08;
    sill.lookAt(sill.position.clone().add(nrm)); house.add(sill);
  }
}

function makeTree(x, z, kind, s){
  const g = new THREE.Group();
  if(kind === 'spruce'){
    const trunk = rod(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1.0*s,0), 0.13*s, trunkMat, 7); g.add(trunk);
    for(let i=0;i<3;i++){
      const r = (1.5 - i*0.38)*s, h = (2.0 - i*0.35)*s;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), spruceMat);
      cone.position.y = (1.1 + i*1.05)*s + h/2 - 0.2*s; cone.castShadow = true; g.add(cone);
    }
  } else {
    const trunk = rod(new THREE.Vector3(0,0,0), new THREE.Vector3(0,2.0*s,0), 0.15*s, trunkMat, 7); g.add(trunk);
    const mat = leafMats[Math.floor((x*7+z*3)%3+3)%3];
    for(const [dx,dy,dz,r] of [[0,3.0,0,1.5],[0.7,2.6,0.3,1.05],[-0.6,2.7,-0.4,1.1],[0.1,3.7,0.2,0.95]]){
      const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(r*s, 2), mat);
      blob.position.set(dx*s, dy*s, dz*s); blob.castShadow = true; g.add(blob);
    }
  }
  g.position.set(x, 0, z);
  envGroup.add(g);
}

let kit = {};
let environmentKey = '';
let pendingBuild = false;
function scheduleBuild(){
  if(pendingBuild) return;
  pendingBuild = true;
  requestAnimationFrame(() => { pendingBuild = false; tileQuality='overview'; build(); });
}

// ширина ската (интервал u) на высоте v
function spanAt(s, v){
  let umin = Infinity, umax = -Infinity;
  for(let i=0;i<s.uv.length;i++){
    const p = s.uv[i], q = s.uv[(i+1)%s.uv.length];
    if((p[1]-v)*(q[1]-v) <= 0 && Math.abs(q[1]-p[1]) > 1e-6){
      const u = p[0] + (q[0]-p[0])*(v-p[1])/(q[1]-p[1]);
      umin = Math.min(umin, u); umax = Math.max(umax, u);
    }
  }
  return [umin, umax];
}

const skylightHalfWidth = 0.39, skylightHalfLength = 0.59;
function skylightSpan(s, v){
  const [lo1, hi1] = spanAt(s, v - skylightHalfLength - 0.15);
  const [lo2, hi2] = spanAt(s, v + skylightHalfLength + 0.15);
  const margin = 0.45 + skylightHalfWidth;
  return [Math.max(lo1, lo2) + margin, Math.min(hi1, hi2) - margin];
}

function skylightsOverlap([u, v], [otherU, otherV]){
  return Math.abs(u - otherU) < 2*skylightHalfWidth + 0.32 &&
         Math.abs(v - otherV) < 2*skylightHalfLength + 0.30;
}

function placeSkylight({group, frame, s, point:[u,v]}){
  needsRender=true;
  const lift = S.mat==='tile' ? 0.048 : 0;
  group.position.copy(s.o).addScaledVector(s.U,u).addScaledVector(s.V,v).addScaledVector(s.n,lift);
  // Extend the frame towards the roof so it supports the raised flashing.
  frame.scale.y = 1+lift/0.13;
  frame.position.copy(s.n).multiplyScalar(0.08-lift/2);
}

function build(){
  endSkylightDrag();
  skylightMeshes.length = 0;
  const M = roofModel();
  const corrected=S.O!==M.effectiveOverhang;
  S.O=M.effectiveOverhang;
  const overhangInput=document.getElementById('slider-O');
  if(overhangInput){
    overhangInput.max=M.maxOverhang;overhangInput.value=S.O;
    overhangInput.parentElement.querySelector('b').textContent=S.O.toFixed(2)+' м';
  }
  const note=document.getElementById('overhang-note');
  if(note) note.textContent=M.maxOverhang<.9 ? `${corrected ? 'Свес уменьшен. ' : ''}Для этой ломаной крыши свес до ${M.maxOverhang.toFixed(2)} м: карниз остаётся не ниже 1,8 м.` : '';
  needsRender=true;
  clearGroup(house);
  roofSurfaceMeshes.length=0;
  const { W, L, H, O } = S;

  // стены, цоколь, отмостка, тень
  const body = new THREE.Mesh(new THREE.BoxGeometry(W, H, L), wallMat);
  body.position.y = H/2; body.castShadow = body.receiveShadow = true; house.add(body);
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(W+0.12, 0.5, L+0.12), plinthMat);
  plinth.position.y = 0.25; plinth.castShadow = plinth.receiveShadow = true; house.add(plinth);
  const paving = new THREE.Mesh(new THREE.PlaneGeometry(W+1.6, L+1.6).rotateX(-Math.PI/2), pavingMat);
  paving.position.y = 0.006; paving.receiveShadow = true; house.add(paving);
  const ao = new THREE.Mesh(new THREE.PlaneGeometry((W+0.6)/0.5625, (L+0.6)/0.5625).rotateX(-Math.PI/2), aoMat);
  ao.position.y = 0.012; ao.renderOrder = 1; house.add(ao);

  // окна и дверь
  const faces = [
    { c:new THREE.Vector3(0,0, L/2), n:new THREE.Vector3(0,0,1),  t:new THREE.Vector3(1,0,0),  len:W, door:true },
    { c:new THREE.Vector3(0,0,-L/2), n:new THREE.Vector3(0,0,-1), t:new THREE.Vector3(-1,0,0), len:W },
    { c:new THREE.Vector3( W/2,0,0), n:new THREE.Vector3(1,0,0),  t:new THREE.Vector3(0,0,-1), len:L },
    { c:new THREE.Vector3(-W/2,0,0), n:new THREE.Vector3(-1,0,0), t:new THREE.Vector3(0,0,1),  len:L },
  ];
  const floors = H >= 5.4 ? [1.6, H - 1.45] : [Math.min(1.65, H - 1.05)];
  let doorX = 0;
  for(const f of faces){
    const count = Math.max(1, Math.floor(f.len / 3.1));
    const step = f.len / count;
    for(let i=0;i<count;i++){
      const off = -f.len/2 + step*(i+0.5);
      floors.forEach((fy, fi) => {
        if(f.door && fi === 0 && i === Math.floor(count/2)){ addOpening(f.c, f.n, f.t, off, 1.15, 1.0, 2.1, 'door'); doorX = off; }
        else addOpening(f.c, f.n, f.t, off, fy, 1.1, 1.3, 'win');
      });
    }
  }
  const path = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 7).rotateX(-Math.PI/2), pathMat);
  path.position.set(doorX, 0.007, L/2 + 0.8 + 3.5); path.receiveShadow = true; house.add(path);

  // крыша
  const lift = new THREE.Vector3(0, 0.04, 0);
  // Шатровые скаты и рёбра используют общие объекты вершин.
  const roofPoints = new Set([...M.slopes.flat(), ...M.ridges.flat()]);
  for(const p of roofPoints) p.add(lift);
  M.y0 += 0.04;

  kit = { area:0, ridge:0, rake:0, eave:0, snow:0 };
  const infos = [];
  const edgeSlopes = new Map();
  const key = (a,b) => [a,b].map(p => `${p.x.toFixed(3)},${p.y.toFixed(3)},${p.z.toFixed(3)}`).sort().join('|');
  let topY = 0;
  for(const pts of M.slopes){
    const s = slopeGeometry(pts);
    kit.area += s.area;
    if(S.mat!=='falz'){s.g.dispose();s.g=roofReliefGeometry(s,MATS[S.mat],tileQuality);}
    const mesh = new THREE.Mesh(s.g, roofMat);
    mesh.userData.roofProfile=S.mat;
    roofSurfaceMeshes.push({mesh,s});
    mesh.receiveShadow = true;
    const backing = new THREE.Mesh(flatGeometry(s.pts), roofBackingMat);
    // Lower every backing by the same vertical offset so adjoining slopes stay closed.
    backing.position.y = -0.006;
    backing.castShadow = backing.receiveShadow = true;
    house.add(mesh, backing);
    infos.push(s);
    for(let i=0;i<s.pts.length;i++){
      const k = key(s.pts[i], s.pts[(i+1)%s.pts.length]);
      if(!edgeSlopes.has(k)) edgeSlopes.set(k, []);
      edgeSlopes.get(k).push(s);
      topY = Math.max(topY, s.pts[i].y);
    }
  }

  const eaves = [];
  for(const s of infos){
    for(let i=0;i<s.pts.length;i++){
      const a = s.pts[i], b = s.pts[(i+1)%s.pts.length];
      const len = a.distanceTo(b);
      const X = b.clone().sub(a).normalize();
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const Z = new THREE.Vector3().crossVectors(X, s.n).normalize();
      const sgn = Math.sign(Z.dot(mid.clone().sub(s.centroid))) || 1;
      const horizontal = Math.abs(a.y - b.y) < 1e-3;
      const shared = edgeSlopes.get(key(a,b)).length > 1;
      if(horizontal && Math.abs(a.y - M.y0) < 1e-3){
        const out = new THREE.Vector3(-s.V.x, 0, -s.V.z).normalize();
        eaves.push({ a, b, out, len });
        kit.eave += len;
        if(S.trims) house.add(orientedBox(len, 0.06, 0.015, X, s.n, mid.clone().addScaledVector(Z, sgn*0.015).addScaledVector(s.n, -0.035), trimMat));
      } else if(!horizontal && !shared){
        kit.rake += len;
        if(S.trims){
          // торцевая планка: лицевая полка + верхняя полка на скате
          house.add(orientedBox(len+0.04, 0.17, 0.02, X, s.n, mid.clone().addScaledVector(Z, sgn*0.03).addScaledVector(s.n, -0.035), trimMat));
          house.add(orientedBox(len+0.04, 0.015, 0.10, X, s.n, mid.clone().addScaledVector(Z, -sgn*0.02).addScaledVector(s.n, 0.035), trimMat));
        }
      }
    }
  }

  // Коньковые и переходные планки повторяют наклон прилегающих скатов.
  for(const [a,b] of M.ridges){
    kit.ridge += a.distanceTo(b);
    addRidgeCap(a,b,edgeSlopes.get(key(a,b)));
  }

  if(S.gutter){
    for(const eave of eaves) addGutter(eave,eaves,O);
  }

  // снегозадержатели (трубчатые) — над карнизом каждого ската с карнизом
  if(S.snow){
    for(const s of infos){
      const hasEave = s.pts.some((p,i) => { const q = s.pts[(i+1)%s.pts.length]; return Math.abs(p.y-M.y0)<1e-3 && Math.abs(q.y-M.y0)<1e-3; });
      if(!hasEave) continue;
      const vMax = Math.max(...s.uv.map(x => x[1]));
      if(vMax < 1.8) continue;
      const v0 = Math.min(0.8, vMax*0.3);
      let [umin, umax] = spanAt(s, v0);
      umin += 0.3; umax -= 0.3;
      if(umax - umin < 0.8) continue;
      const P = (u,v) => s.o.clone().addScaledVector(s.U, u).addScaledVector(s.V, v);
      const t1 = rod(P(umin,v0).addScaledVector(s.n, 0.07), P(umax,v0).addScaledVector(s.n, 0.07), 0.014, trimMat, 8);
      const t2 = rod(P(umin,v0+0.04).addScaledVector(s.n, 0.14), P(umax,v0+0.04).addScaledVector(s.n, 0.14), 0.014, trimMat, 8);
      if(t1) house.add(t1); if(t2) house.add(t2);
      const nb = Math.ceil((umax-umin)/0.9) + 1;
      for(let i=0;i<nb;i++){
        const u = umin + (umax-umin)*i/(nb-1);
        house.add(orientedBox(0.13, 0.17, 0.012, s.V, s.n, P(u, v0+0.02).addScaledVector(s.n, 0.085), trimMat));
      }
      kit.snow += umax - umin;
    }
  }

  // мансардные окна: рама + стекло + оклад, в плоскости ската
  if(S.skyN > 0){
    const maxA = Math.max(...infos.map(x => x.area));
    const hw = skylightHalfWidth, hl = skylightHalfLength;
    for(const [slopeIndex, s] of infos.entries()){
      if(s.area < maxA*0.35) continue;
      const vMax = Math.max(...s.uv.map(x => x[1]));
      const lo = 1.0 + hl, hi = vMax - 0.5 - hl;
      if(hi < lo) continue;
      const vc = lo + (hi - lo)*THREE.MathUtils.clamp((S.skyPos - 0.2)/0.6, 0, 1);
      const [umin, umax] = skylightSpan(s, vc);
      if(!(umax >= umin)) continue;
      let n = S.skyN;
      while(n > 1 && (umax - umin)/(n - 1) < 2*hw + 0.7) n--;
      const defaults = Array.from({length:n}, (_, i) => [
        n === 1 ? (umin + umax)/2 : umin + (umax - umin)*i/(n - 1), vc
      ]);
      const positions = defaults.map((point, i) => {
        const saved = S.skylights[`${slopeIndex}:${i}`];
        if(!saved || saved[1] < lo || saved[1] > hi) return point;
        const [min, max] = skylightSpan(s, saved[1]);
        return saved[0] >= min && saved[0] <= max ? saved : point;
      });
      const overlaps = positions.some((point, i) =>
        positions.slice(0, i).some(other => skylightsOverlap(point, other)));
      const layout = overlaps ? defaults : positions;
      for(const [i, point] of layout.entries()){
        const group = new THREE.Group();
        const height = (offset, along = 0) => s.n.clone().multiplyScalar(offset).addScaledVector(s.V, along);
        const frame = orientedBox(2*hw+0.08, 0.13, 2*hl+0.08, s.U, s.n, height(0.08), skyFrameMat);
        group.add(
          orientedBox(2*hw+0.32, 0.03, 2*hl+0.3, s.U, s.n, height(0.03), skyFrameMat),
          frame,
          orientedBox(2*hw-0.06, 0.02, 2*hl-0.1, s.U, s.n, height(0.15, -0.01), skyGlassMat),
          orientedBox(2*hw+0.06, 0.04, 0.07, s.U, s.n, height(0.16, hl+0.01), skyFrameMat)
        );
        const skylight = {group, frame, s, lo, hi, point, key:`${slopeIndex}:${i}`};
        placeSkylight(skylight);
        house.add(group);
        skylightMeshes.push(skylight);
      }
    }
  }

  for(const pts of M.walls){
    const w = new THREE.Mesh(flatGeometry(pts), wallMat);
    w.castShadow = w.receiveShadow = true; house.add(w);
  }

  // деревья
  const nextEnvironmentKey = `${W}:${L}:${S.trees}`;
  if(environmentKey !== nextEnvironmentKey){
    clearGroup(envGroup);
    environmentKey = nextEnvironmentKey;
    if(S.trees){
    const R = Math.hypot(W, L)/2 + 4.5;
    for(const [ang, dr, kind, sc] of [[-55,0.5,'round',1.1],[-105,2.5,'spruce',1.15],[125,1.5,'round',1.25],[165,3.5,'spruce',1.3],[210,0.8,'round',0.95],[255,2.2,'spruce',1.0],[-150,6,'round',1.0]]){
      const a = ang*Math.PI/180, r = R + dr;
      makeTree(Math.sin(a)*r, Math.cos(a)*r, kind, sc);
    }
    }
  }

  updateStats(M.pitchText);
}

function updateStats(pitchText){
  const typ = TYPES.find(x => x.id === S.type);
  document.getElementById('stats').innerHTML =
    `<b>${typ.name}</b> · скатов: ${typ.n}<br>` +
    `Угол: ${pitchText}<br>` +
    `${MATS[S.mat].name}, RAL ${S.ral}`;
}

/* ================= внешний вид ================= */
function applyLook(){
  needsRender=true;
  for(const {mesh,s} of roofSurfaceMeshes){
    if(mesh.userData.roofProfile!==S.mat){
      endSkylightDrag();
      mesh.geometry.dispose();
      mesh.geometry=S.mat==='falz' ? slopeGeometry(s.pts).g : roofReliefGeometry(s,MATS[S.mat],tileQuality);
      s.g=mesh.geometry;
      mesh.userData.roofProfile=S.mat;
    }
  }
  for(const skylight of skylightMeshes) placeSkylight(skylight);
  updateStats(roofModel().pitchText);
  const r = RAL.find(r => r[0] === S.ral);
  roofMat.color.set(r[2]); trimMat.color.set(r[2]); roofBackingMat.color.set(r[2]);
  const c = COATS[S.coat];
  roofMat.roughness = trimMat.roughness = c.r;
  roofMat.clearcoat = S.coat === 'gloss' ? .38 : (S.coat === 'pural' ? .16 : 0);
  roofMat.clearcoatRoughness = S.coat === 'gloss' ? .2 : .5;
  roofMat.metalness = trimMat.metalness = c.m;
  U.uProfile.value = MATS[S.mat].prof;
  U.uPer.value = MATS[S.mat].per;
  U.uHeight.value = MATS[S.mat].height;
  U.uMatteTexture.value = S.coat==='matt';
  document.getElementById('ralname').textContent = `RAL ${r[0]} · ${r[1]}`;
  const f = FACADE[S.facade];
  WU.uKind.value = f[0]; wallMat.color.set(f[1]);
  document.getElementById('facname').textContent = f[2];
  plinthMat.color.set(PLINTH[S.plinth][0]);
  document.getElementById('plname').textContent = PLINTH[S.plinth][1];
  frameMat.color.set(FRAMES[S.frames][0]);
  const gc = GUTTER.find(g => g[0] === S.gutCol);
  gutterMat.color.set(gc[2] || r[2]);
  gutterMat.roughness = c.r; gutterMat.metalness = c.m;
  doorMat.color.set(S.frames === 2 ? '#6e4527' : (S.frames === 1 ? '#2f3236' : '#5a4232'));
}

/* ================= UI ================= */
function segment(el, items, key, onChange, html){
  el.innerHTML = '';
  for(const [id, label] of items){
    const b = document.createElement('button');
    b.innerHTML = html ? html(id, label) : label;
    if(S[key] === id) b.classList.add('on');
    b.setAttribute('aria-pressed', String(S[key] === id));
    b.onclick = () => { if(key === 'type' && S.type !== id) S.skylights = {}; S[key] = id; [...el.children].forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); }); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); onChange(); };
    el.appendChild(b);
  }
}
segment(document.getElementById('types'), TYPES.map(t => [t.id, t.name]), 'type', build,
  (id, label) => { const t = TYPES.find(x => x.id === id); return `<svg viewBox="0 0 42 30">${t.icon}</svg>${label}<small>${t.n} ${t.n===1?'скат':'ската'}</small>`; });
segment(document.getElementById('mats'),  Object.entries(MATS).map(([k,v]) => [k, v.name]),  'mat',  applyLook);
segment(document.getElementById('coats'), Object.entries(COATS).map(([k,v]) => [k, v.name]), 'coat', applyLook);
segment(document.getElementById('frames'), FRAMES.map((f,i) => [i, f[1]]), 'frames', applyLook);

function swatches(el, list, key, bg, title){
  list.forEach((item, i) => {
    const b = document.createElement('button');
    b.style.background = bg(item); b.title = title(item); b.setAttribute('aria-label', title(item));
    const id = key === 'ral' ? item[0] : i;
    if(S[key] === id) b.classList.add('on');
    b.setAttribute('aria-pressed', String(S[key] === id));
    b.onclick = () => { S[key] = id; [...el.children].forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); }); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); applyLook(); };
    el.appendChild(b);
  });
}
swatches(document.getElementById('rals'), RAL, 'ral', r => r[2], r => `RAL ${r[0]} — ${r[1]}`);
swatches(document.getElementById('facade'), FACADE, 'facade', f =>
  f[0] === 1 ? `repeating-linear-gradient(0deg, rgba(235,230,220,.55) 0 1.5px, transparent 1.5px 7px), ${f[1]}`
  : f[0] === 2 ? `repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 11px), ${f[1]}` : f[1], f => f[2]);
swatches(document.getElementById('plinth'), PLINTH, 'plinth', p => p[0], p => p[1]);

function toggles(el, list){
  for(const [k, label] of list){
    const l = document.createElement('label'); l.className = 'tg';
    l.innerHTML = `<span>${label}</span><input type="checkbox" ${S[k] ? 'checked' : ''}><i></i>`;
    l.querySelector('input').onchange = (e) => { S[k] = e.target.checked; build(); };
    el.appendChild(l);
  }
}
toggles(document.getElementById('toggles'), [['trims','Торцевые и карнизные планки'],['snow','Снегозадержатели'],['gutter','Водосточная система']]);
toggles(document.getElementById('envtoggles'), [['trees','Деревья']]);

function addSlider(parent, s){
  const row = document.createElement('div'); row.className = 'row';
  const fmt = s.fmt || (v => (s.step < 1 ? (+v).toFixed(s.step < 0.1 ? 2 : 1) : v) + s.unit);
  row.innerHTML = `<label for="slider-${s.k}"><span>${s.label}</span><b>${fmt(S[s.k])}</b></label><input id="slider-${s.k}" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${S[s.k]}">`;
  const inp = row.querySelector('input'), out = row.querySelector('b');
  inp.oninput = () => { S.skylights = {}; S[s.k] = parseFloat(inp.value); out.textContent = fmt(inp.value); scheduleBuild(); };
  inp.onchange=()=>requestAnimationFrame(()=>refreshRoofDetail());
  parent.appendChild(row);
}
for(const s of SLIDERS) addSlider(document.getElementById('sliders'), s);
const skyEl = document.getElementById('skysl');
addSlider(skyEl, { k:'skyN', label:'Мансардные окна на скат', min:0, max:3, step:1, fmt: v => +v === 0 ? 'нет' : `${v} шт` });
segment(document.getElementById('ridge-style'), [['round','Полукруглый'],['rect','Прямоугольный']], 'ridgeStyle', build);
segment(document.getElementById('gutcol'), GUTTER.map(g => [g[0], g[1]]), 'gutCol', applyLook);

const hourEl = document.getElementById('hour'), hourV = document.getElementById('hourv');
const fmtH = h => `${Math.floor(h)}:${String(Math.round((h%1)*60)).padStart(2,'0')}`;
hourEl.value = S.hour; hourV.textContent = fmtH(S.hour);
hourEl.oninput = () => { S.hour = +hourEl.value; hourV.textContent = fmtH(S.hour); setTime(S.hour, false); };
hourEl.onchange = () => setTime(S.hour, true);

const viewButtons = document.querySelectorAll('[data-view]');
function markView(name){
  for(const button of viewButtons) button.setAttribute('aria-pressed', String(button.dataset.view===name));
}
controls.addEventListener('start', () => markView());
const rotBtn = document.getElementById('rot');
rotBtn.setAttribute('aria-pressed', 'false');
rotBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; if(controls.autoRotate) markView(); rotBtn.classList.toggle('on', controls.autoRotate); rotBtn.setAttribute('aria-pressed', String(controls.autoRotate)); };
const skylightRay = new THREE.Raycaster();
let skylightDrag = null;

function aimSkylightRay(event){
  const rect = canvas.getBoundingClientRect();
  skylightRay.setFromCamera(new THREE.Vector2(
    (event.clientX - rect.left)/rect.width*2 - 1,
    1 - (event.clientY - rect.top)/rect.height*2
  ), camera);
}

canvas.addEventListener('pointerdown', event => {
  if(skylightDrag || pendingBuild || !event.isPrimary || event.button !== 0) return;
  aimSkylightRay(event);
  house.updateMatrixWorld(true);
  const [hit] = skylightRay.intersectObjects(skylightMeshes.map(skylight => skylight.group));
  if(!hit) return;
  const [roofHit] = skylightRay.intersectObjects(roofSurfaceMeshes.map(({mesh}) => mesh));
  if(roofHit && roofHit.distance < hit.distance) return;
  const skylight = skylightMeshes.find(skylight => skylight.group === hit.object.parent);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(skylight.s.n, hit.point);
  const offset = hit.point.clone().sub(skylight.group.position);
  skylightDrag = {skylight, plane, offset, pointerId:event.pointerId};
  event.preventDefault();
  event.stopImmediatePropagation();
  canvas.setPointerCapture(event.pointerId);
  controls.enabled = false;
  controls.autoRotate = false;
  rotBtn.classList.remove('on');
  rotBtn.setAttribute('aria-pressed', 'false');
  canvas.style.cursor = 'grabbing';
}, {capture:true});

canvas.addEventListener('pointermove', event => {
  if(skylightDrag?.pointerId !== event.pointerId) return;
  const {skylight, plane, offset} = skylightDrag;
  const {s, lo, hi} = skylight;
  aimSkylightRay(event);
  const hit = skylightRay.ray.intersectPlane(plane, new THREE.Vector3());
  if(!hit) return;
  const delta = hit.sub(offset).sub(s.o);
  let v = THREE.MathUtils.clamp(delta.dot(s.V), lo, hi);
  let [min, max] = skylightSpan(s, v);
  if(!(min <= max)){
    v = skylight.point[1];
    [min, max] = skylightSpan(s, v);
  }
  const u = THREE.MathUtils.clamp(delta.dot(s.U), min, max);
  const point = [u, v];
  if(skylightMeshes.some(other => other !== skylight && other.s === s && skylightsOverlap(point, other.point))) return;
  skylight.point = S.skylights[skylight.key] = point;
  placeSkylight(skylight);
});

function endSkylightDrag(event){
  if(!skylightDrag || (event && event.pointerId !== skylightDrag.pointerId)) return;
  const {pointerId} = skylightDrag;
  skylightDrag = null;
  if(canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
  controls.enabled = true;
  canvas.style.cursor = '';
}
for(const event of ['pointerup', 'pointercancel', 'lostpointercapture']){
  canvas.addEventListener(event, endSkylightDrag);
}

function setView(name='overview'){
  // Include tall single-slope and mansard roofs when framing the house.
  const box = new THREE.Box3().setFromPoints([
    ...roofModel().slopes.flat(),
    new THREE.Vector3(-S.W/2,0,-S.L/2),
    new THREE.Vector3(S.W/2,0,S.L/2)
  ]);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = size.length()/2;
  const angle = Math.min(camera.fov*Math.PI/360, Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect));
  const distance = Math.max(5, radius/Math.sin(angle)*1.08);
  const directions = {overview:[.78,.5,.95],front:[0,.12,1],side:[1,.12,0],top:[0,1,.001],roof:[.65,.9,.8]};
  if(name==='roof') center.y = box.max.y - Math.max(1,size.y*.2);
  const direction = new THREE.Vector3(...(directions[name] || directions.overview)).normalize();
  controls.autoRotate = false;
  rotBtn.classList.remove('on'); rotBtn.setAttribute('aria-pressed','false');
  controls.target.copy(center);
  camera.position.copy(center).addScaledVector(direction, Math.min(145,distance*(name==='roof'?.75:1)));
  // Prevent damping from moving the camera after choosing a fixed view.
  const damping = controls.enableDamping; controls.enableDamping=false; controls.update(); controls.enableDamping=damping;
  markView(name);
  refreshRoofDetail(name==='roof' ? 'detail' : 'overview');
  needsRender=true;
}
function resetView(){ setView('overview'); }
document.getElementById('reset').onclick = resetView;
const fullscreenBtn = document.getElementById('fullscreen');
const app = document.getElementById('app');

function syncFullscreenButton(){
  const expanded = document.fullscreenElement===view || app.classList.contains('is-expanded');
  fullscreenBtn.textContent = expanded ? 'Свернуть' : 'На весь экран';
  fullscreenBtn.setAttribute('aria-label',expanded ? 'Выйти из полноэкранного режима' : 'На весь экран');
  fullscreenBtn.classList.toggle('on',expanded);
}

fullscreenBtn.onclick = async () => {
  if(app.classList.contains('is-expanded')){
    app.classList.remove('is-expanded');
  } else if(document.fullscreenElement===view){
    await document.exitFullscreen();
  } else {
    try {
      if(document.fullscreenEnabled && view.requestFullscreen){
        await view.requestFullscreen();
      } else {
        app.classList.add('is-expanded');
      }
    } catch {
      app.classList.add('is-expanded');
    }
  }
  syncFullscreenButton();
};
document.addEventListener('fullscreenchange',syncFullscreenButton);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape' && app.classList.contains('is-expanded')){
    app.classList.remove('is-expanded');
    syncFullscreenButton();
    fullscreenBtn.focus();
  }
});
for(const button of viewButtons) button.onclick=()=>setView(button.dataset.view);
const actionStatus=document.getElementById('action-status');
const shareUrl=document.getElementById('share-url');
document.getElementById('dismiss-action').onclick=()=>{
  const source = document.getElementById(shareUrl.hidden ? 'export' : 'share');
  actionStatus.textContent = '';
  shareUrl.hidden = true;
  source.focus();
};
document.getElementById('share').onclick=async()=>{
  const url=new URL(location.href);
  url.hash='roof='+encodeConfiguration(S,{position:camera.position.toArray(),target:controls.target.toArray()});
  shareUrl.value=url.href; shareUrl.hidden=false;
  if(location.protocol==='file:'){
    actionStatus.textContent='Конфигурация сохранена в адресе ниже. Чтобы делиться ссылкой, откройте визуализатор на опубликованном сайте.';
    shareUrl.focus(); shareUrl.select(); return;
  }
  try {
    await navigator.clipboard.writeText(url.href);
    actionStatus.textContent='Ссылка скопирована. Она сохраняет параметры дома и ракурс.';
  } catch {
    actionStatus.textContent='Скопируйте ссылку из поля ниже.'; shareUrl.focus(); shareUrl.select();
  }
};
document.getElementById('export').onclick=()=>{
  if(pendingBuild){ pendingBuild=false; build(); }
  try {
    // Capture immediately after rendering, before WebGL clears its drawing buffer.
    sky.position.copy(camera.position); renderer.render(scene,camera);
    const output=document.createElement('canvas');
    output.width=canvas.width; output.height=canvas.height+100;
    const ctx=output.getContext('2d');
    ctx.drawImage(canvas,0,0);
    ctx.fillStyle='#ffffff';ctx.fillRect(0,canvas.height,output.width,100);
    ctx.fillStyle='#1d232b';ctx.font='24px system-ui';
    const caption=`${TYPES.find(t=>t.id===S.type).name} · ${MATS[S.mat].name}`;
    ctx.fillText(caption,20,canvas.height+36,output.width-40);
    ctx.font='20px system-ui';ctx.fillText(`${COATS[S.coat].name} · RAL ${S.ral}`,20,canvas.height+72,output.width-40);
    output.toBlob(blob=>{
      if(!blob){actionStatus.textContent='Не удалось создать PNG. Попробуйте ещё раз.';return;}
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=`roof-${S.type}-RAL${S.ral}.png`;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      actionStatus.textContent='PNG подготовлен к скачиванию.';
    },'image/png');
  } catch(error){ console.error(error);actionStatus.textContent='Не удалось сохранить изображение. Попробуйте другой браузер.'; }
};

/* ================= цикл ================= */
function resize(){
  needsRender=true;
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  U.uViewportHeight.value = canvas.height;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

setTime(S.hour, true);
applyLook();
build();
resize();
resetView();
if(savedConfiguration?.camera){
  camera.position.fromArray(savedConfiguration.camera.position);
  controls.target.fromArray(savedConfiguration.camera.target);
  controls.update();
  markView();
  refreshRoofDetail();
}
if(location.hash.startsWith('#roof=') && !savedConfiguration) actionStatus.textContent='Ссылка повреждена или имеет неподдерживаемую версию. Открыты стандартные настройки.';
document.getElementById('loading').remove();

renderer.setAnimationLoop(() => {
  const moved=!skylightDrag && controls.update();
  if(moved || needsRender || controls.autoRotate){
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
    needsRender=false;
  }
});
} catch(error) {
  console.error('Не удалось запустить 3D-визуализатор:', error);
  const loading = document.getElementById('loading');
  if(loading){
    loading.setAttribute('role', 'alert');
    loading.style.padding = '24px';
    loading.style.textAlign = 'center';
    loading.textContent = 'Не удалось загрузить 3D. Проверьте подключение к интернету и поддержку WebGL в браузере, затем обновите страницу.';
  }
}
</script>
