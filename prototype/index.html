const slopeControls = document.getElementById('skysl');

function updateSlopeControls(slopes,eaveHeight){
  if(slopeControls.children.length!==slopes.length){
    slopeControls.replaceChildren();
    slopes.forEach((_,index)=>{
      const row = document.createElement('fieldset');
      row.className = 'slope-controls';
      row.innerHTML = `<legend></legend>
        <label>Окна <select data-count="slopeWindows"></select></label>
        <label>Выходы <select data-count="slopeVents"></select></label>
        <label class="dormer-toggle"><input type="checkbox"> Эркер на скате</label>
        <small></small>`;
      row.querySelector('.dormer-toggle input').onchange = event => {
        S.slopeDormers = event.target.checked ? [...S.slopeDormers,index] : S.slopeDormers.filter(i=>i!==index);
        build();
      };
      for(const [key,max,items] of [['slopeWindows',3,skylightMeshes],['slopeVents',6,roofVents]]){
        const select = row.querySelector(`[data-count="${key}"]`);
        for(let n=0;n<=max;n++) select.add(new Option(String(n),String(n)));
        select.onchange=()=>{
          if(!S[key]){
            S[key]=Array.from(slopeControls.children,(_,i)=>items.filter(item=>item.slopeIndex===i).length);
            if(key==='slopeVents'){
              const indexes = Array(slopeControls.children.length).fill(0);
              S.vents=Object.fromEntries(roofVents.map(({slopeIndex,point})=>
                [`${slopeIndex}:${indexes[slopeIndex]++}`,[slopeIndex,...point]]));
            }
          }
          S[key][index]=Number(select.value);
          build();
        };
      }
      slopeControls.appendChild(row);
    });
  }
  slopes.forEach((s,index)=>{
    const row = slopeControls.children[index];
    const {x,z} = s.n;
    const side = Math.abs(x)>Math.abs(z) ? (x>0 ? 'справа' : 'слева') : (z>0 ? 'спереди' : 'сзади');
    const level = S.type==='gambrel' ? (s.pts.some(p=>Math.abs(p.y-eaveHeight)<1e-3) ? ', нижний' : ', верхний') : '';
    row.querySelector('legend').textContent = `Скат ${index+1} · ${side}${level}`;
    const windows = skylightMeshes.filter(item=>item.slopeIndex===index).length;
    const vents = roofVents.filter(item=>item.slopeIndex===index).length;
    const requestedWindows = S.slopeWindows?.[index] ?? windows;
    const requestedVents = S.slopeVents?.[index] ?? vents;
    row.querySelector('[data-count="slopeWindows"]').value=requestedWindows;
    row.querySelector('[data-count="slopeVents"]').value=requestedVents;
    const dormerRequested = S.slopeDormers.includes(index);
    row.querySelector('.dormer-toggle input').checked = dormerRequested;
    const messages = [];
    if(dormerRequested && !s.dormer) messages.push('Эркеру не хватает места на этом скате.');
    if(windows<requestedWindows || vents<requestedVents) messages.push(`Поместилось: окон ${windows}, выходов ${vents}.`);
    row.querySelector('small').textContent = messages.join(' ');
  });
}

const viewButtons = document.querySelectorAll('[data-view]');
function markView(name){
  for(const button of viewButtons) button.setAttribute('aria-pressed', String(button.dataset.view===name));
}
controls.addEventListener('start', () => markView());
const rotBtn = document.getElementById('rot');
rotBtn.setAttribute('aria-pressed', 'false');
rotBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; if(controls.autoRotate) markView(); rotBtn.classList.toggle('on', controls.autoRotate); rotBtn.setAttribute('aria-pressed', String(controls.autoRotate)); };
const roofItemRay = new THREE.Raycaster();
let roofItemDrag = null;

function aimRoofItemRay(event){
  const rect = canvas.getBoundingClientRect();
  roofItemRay.setFromCamera(new THREE.Vector2(
    (event.clientX - rect.left)/rect.width*2 - 1,
    1 - (event.clientY - rect.top)/rect.height*2
  ), camera);
}

canvas.addEventListener('pointerdown', event => {
  if(roofItemDrag || pendingBuild || !event.isPrimary || event.button !== 0) return;
  aimRoofItemRay(event);
  house.updateMatrixWorld(true);
  const items = [...skylightMeshes,...roofVents];
  const [hit] = roofItemRay.intersectObjects(items.map(item=>item.group));
  if(!hit) return;
  const [roofHit] = roofItemRay.intersectObjects(roofSurfaceMeshes.map(({mesh}) => mesh));
  if(roofHit && roofHit.distance < hit.distance) return;
  const item = items.find(item=>item.group===hit.object.parent);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(item.s.n, hit.point);
  const offset = hit.point.clone().sub(item.group.position);
  roofItemDrag = {item, plane, offset, pointerId:event.pointerId};
  event.preventDefault();
  event.stopImmediatePropagation();
  canvas.setPointerCapture(event.pointerId);
  controls.enabled = false;
  controls.autoRotate = false;
  rotBtn.classList.remove('on');
  rotBtn.setAttribute('aria-pressed', 'false');
  canvas.style.cursor = 'grabbing';
}, {capture:true});

canvas.addEventListener('pointermove', event => {
  if(roofItemDrag?.pointerId !== event.pointerId) return;
  const {item, plane, offset} = roofItemDrag;
  const {s, lo, hi} = item;
  const span = item.frame ? skylightSpan : ventSpan;
  aimRoofItemRay(event);
  const hit = roofItemRay.ray.intersectPlane(plane, new THREE.Vector3());
  if(!hit) return;
  const delta = hit.sub(offset).sub(s.o);
  let v = THREE.MathUtils.clamp(delta.dot(s.V), lo, hi);
  let [min, max] = span(s,v);
  if(!(min<=max)){
    v = item.point[1];
    [min,max] = span(s,v);
  }
  const u = THREE.MathUtils.clamp(delta.dot(s.U), min, max);
  const point = [u, v];
  if(item.frame){
    if(overlapsDormer(s,point,skylightHalfWidth+0.16,skylightHalfLength+0.15)) return;
    if(roofVents.some(vent=>vent.s===s && overlapsVent(point,vent.point))) return;
    if(skylightMeshes.some(other=>other!==item && other.s===s && skylightsOverlap(point,other.point))) return;
    item.point = S.skylights[item.key] = point;
    placeSkylight(item);
  } else {
    if(ventOverlaps(s,point,item)) return;
    item.point = point;
    S.vents[item.key] = [item.slopeIndex,...point];
    placeVent(item);
  }
});

function endRoofItemDrag(event){
  if(!roofItemDrag || (event && event.pointerId !== roofItemDrag.pointerId)) return;
  const {pointerId} = roofItemDrag;
  roofItemDrag = null;
  if(canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
  controls.enabled = true;
  canvas.style.cursor = '';
}
for(const event of ['pointerup', 'pointercancel', 'lostpointercapture']){
  canvas.addEventListener(event, endRoofItemDrag);
}

function setView(name='overview'){
  // Include tall single-slope and mansard roofs when framing the house.
  const points = [
    ...roofModel().slopes.flat(),
    new THREE.Vector3(-S.W/2,0,-S.L/2),
    new THREE.Vector3(S.W/2,0,S.L/2)
  ];
  if(name!=='roof'){
    const reach = bayDepth*1.13;
    for(const [id,x,z] of [['front',0,S.L/2+reach],['back',0,-S.L/2-reach],
      ['right',S.W/2+reach,0],['left',-S.W/2-reach,0]]){
      if(S.bayFaces.includes(id)) points.push(new THREE.Vector3(x,0,z));
    }
    if(S.fence!=='none' && (name==='overview' || name==='top')){
      const x = S.W/2+fenceSetback+0.26, z = S.L/2+fenceSetback+0.26;
      points.push(new THREE.Vector3(-x,0,-z),new THREE.Vector3(x,S.fenceHeight,z));
    }
  }
  const box = new THREE.Box3().setFromPoints(points);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = size.length()/2;
  const angle = Math.min(camera.fov*Math.PI/360, Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect));
  const distance = Math.max(5, radius/Math.sin(angle)*1.08);
  const directions = {overview:[.78,.5,.95],front:[0,.12,1],side:[1,.12,0],top:[0,1,.001],roof:[.65,.9,.8]};
  if(name==='roof') center.y = box.max.y - Math.max(1,size.y*.2);
  const direction = new THREE.Vector3(...(directions[name] || directions.overview)).normalize();
  controls.autoRotate = false;
  rotBtn.classList.remove('on'); rotBtn.setAttribute('aria-pressed','false');
  controls.target.copy(center);
  camera.position.copy(center).addScaledVector(direction, Math.min(145,distance*(name==='roof'?.75:1)));
  // Prevent damping from moving the camera after choosing a fixed view.
  const damping = controls.enableDamping; controls.enableDamping=false; controls.update(); controls.enableDamping=damping;
  markView(name);
  refreshRoofDetail(name==='roof' ? 'detail' : 'overview');
  needsRender=true;
}
function resetView(){ setView('overview'); }
document.getElementById('reset').onclick = resetView;
const fullscreenBtn = document.getElementById('fullscreen');
const app = document.getElementById('app');

function syncFullscreenButton(){
  const expanded = document.fullscreenElement===view || app.classList.contains('is-expanded');
  fullscreenBtn.textContent = expanded ? 'Свернуть' : 'На весь экран';
  fullscreenBtn.setAttribute('aria-label',expanded ? 'Выйти из полноэкранного режима' : 'На весь экран');
  fullscreenBtn.classList.toggle('on',expanded);
}

fullscreenBtn.onclick = async () => {
  if(app.classList.contains('is-expanded')){
    app.classList.remove('is-expanded');
  } else if(document.fullscreenElement===view){
    await document.exitFullscreen();
  } else {
    try {
      if(document.fullscreenEnabled && view.requestFullscreen){
        await view.requestFullscreen();
      } else {
        app.classList.add('is-expanded');
      }
    } catch {
      app.classList.add('is-expanded');
    }
  }
  syncFullscreenButton();
};
document.addEventListener('fullscreenchange',syncFullscreenButton);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape' && app.classList.contains('is-expanded')){
    app.classList.remove('is-expanded');
    syncFullscreenButton();
    fullscreenBtn.focus();
  }
});
for(const button of viewButtons) button.onclick=()=>setView(button.dataset.view);
const actionStatus=document.getElementById('action-status');
const shareUrl=document.getElementById('share-url');
document.getElementById('dismiss-action').onclick=()=>{
  const source = document.getElementById(shareUrl.hidden ? 'export' : 'share');
  actionStatus.textContent = '';
  shareUrl.hidden = true;
  source.focus();
};
document.getElementById('share').onclick=async()=>{
  const url=new URL(location.href);
  url.hash='roof='+encodeConfiguration(S,{position:camera.position.toArray(),target:controls.target.toArray()});
  shareUrl.value=url.href; shareUrl.hidden=false;
  if(location.protocol==='file:'){
    actionStatus.textContent='Конфигурация сохранена в адресе ниже. Чтобы делиться ссылкой, откройте визуализатор на опубликованном сайте.';
    shareUrl.focus(); shareUrl.select(); return;
  }
  try {
    await navigator.clipboard.writeText(url.href);
    actionStatus.textContent='Ссылка скопирована. Она сохраняет параметры дома и ракурс.';
  } catch {
    actionStatus.textContent='Скопируйте ссылку из поля ниже.'; shareUrl.focus(); shareUrl.select();
  }
};
document.getElementById('export').onclick=()=>{
  if(pendingBuild){ pendingBuild=false; build(); }
  try {
    // Capture immediately after rendering, before WebGL clears its drawing buffer.
    sky.position.copy(camera.position); renderer.render(scene,camera);
    const output=document.createElement('canvas');
    output.width=canvas.width; output.height=canvas.height+100;
    const ctx=output.getContext('2d');
    ctx.drawImage(canvas,0,0);
    ctx.fillStyle='#ffffff';ctx.fillRect(0,canvas.height,output.width,100);
    ctx.fillStyle='#1d232b';ctx.font='24px system-ui';
    const caption=`${TYPES.find(t=>t.id===S.type).name} · ${MATS[S.mat].name}`;
    ctx.fillText(caption,20,canvas.height+36,output.width-40);
    ctx.font='20px system-ui';ctx.fillText(`${COATS[S.coat].name} · RAL ${S.ral}`,20,canvas.height+72,output.width-40);
    output.toBlob(blob=>{
      if(!blob){actionStatus.textContent='Не удалось создать PNG. Попробуйте ещё раз.';return;}
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=`roof-${S.type}-RAL${S.ral}.png`;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      actionStatus.textContent='PNG подготовлен к скачиванию.';
    },'image/png');
  } catch(error){ console.error(error);actionStatus.textContent='Не удалось сохранить изображение. Попробуйте другой браузер.'; }
};

/* ================= цикл ================= */
function resize(){
  needsRender=true;
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  U.uViewportHeight.value = canvas.height;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

setTime(S.hour, true);
applyLook();
build();
resize();
resetView();
if(savedConfiguration?.camera){
  camera.position.fromArray(savedConfiguration.camera.position);
  controls.target.fromArray(savedConfiguration.camera.target);
  controls.update();
  markView();
  refreshRoofDetail();
}
if(location.hash.startsWith('#roof=') && !savedConfiguration) actionStatus.textContent='Ссылка повреждена или имеет неподдерживаемую версию. Открыты стандартные настройки.';
document.getElementById('loading').remove();

renderer.setAnimationLoop(() => {
  const moved=!roofItemDrag && controls.update();
  if(moved || needsRender || controls.autoRotate){
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
    needsRender=false;
  }
});
} catch(error) {
  console.error('Не удалось запустить 3D-визуализатор:', error);
  const loading = document.getElementById('loading');
  if(loading){
    loading.setAttribute('role', 'alert');
    loading.style.padding = '24px';
    loading.style.textAlign = 'center';
    loading.textContent = 'Не удалось загрузить 3D. Проверьте подключение к интернету и поддержку WebGL в браузере, затем обновите страницу.';
  }
}
</script>
</body>
</html>
