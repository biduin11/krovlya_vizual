<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Примерка кровли 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #173137;
    --muted: #48666b;
    --line: #d3e5e4;
    --panel: #edf7f5;
    --accent: #087b70;
    --accent-dark: #08675e;
    --accent-light: #dbf5ef;
    --warm: #b84625;
    --warm-light: #fff1e7;
    --shadow: 0 4px 16px #18464a0c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font: 14px Inter, system-ui, sans-serif; color: var(--ink); background: var(--panel); }
  /* Страница не прокручивается: листается только панель, сцена всегда на экране. */
  body { overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, .tg input:focus-visible + i {
    outline: 2px solid var(--accent-dark);
    outline-offset: 3px;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .app-header {
    position: relative; z-index: 2; flex: none; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .app-header h1 { font-size: clamp(16px, 2vw, 22px); font-weight: 700; letter-spacing: -.035em; line-height: 1.15; }
  .header-actions { position: relative; flex: none; }
  .header-actions .seg button { min-height: 38px; padding-inline: 13px; }
  .action-details {
    position: absolute; right: 0; top: calc(100% + 9px); width: min(345px, calc(100vw - 24px)); z-index: 1;
    padding: 10px 36px 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
    box-shadow: 0 8px 25px #123c4526;
  }
  #dismiss-action {
    position: absolute; top: 6px; right: 6px; width: 25px; height: 25px;
    border: 0; border-radius: 6px; background: var(--panel); color: var(--ink); font-size: 17px;
  }
  .action-details:has(#action-status:empty):has(#share-url[hidden]) { display: none; }
  #workspace { display: flex; flex: 1; min-height: 0; gap: 14px; padding: 14px; max-width: 1920px; width: 100%; margin-inline: auto; }
  #view { position: relative; flex: 1; min-width: 0; border-radius: 17px; overflow: hidden; background: linear-gradient(#9fc0e2, #dbe7f2 60%, #c9d3bb); }
  #view:fullscreen { width: 100%; height: 100%; border-radius: 0; }
  #app.is-expanded .app-header, #app.is-expanded aside { display: none; }
  #app.is-expanded #workspace { padding: 0; max-width: none; }
  #app.is-expanded #view { flex: 1; height: auto; border-radius: 0; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud, .viewbtns button, #views {
    background: #f6fffcf2;
    border: 1px solid #fff;
    box-shadow: 0 5px 20px #123c451c;
  }
  .hud {
    position: absolute; left: 16px; top: 16px; border-left: 4px solid var(--accent);
    border-radius: 13px; padding: 10px 13px; font-size: 13px; line-height: 1.55;
    max-width: calc(100% - 200px); color: var(--muted);
  }
  .hud b { font-weight: 700; color: var(--ink); }
  .viewbtns { position: absolute; right: 16px; top: 16px; display: flex; gap: 8px; }
  .viewbtns button { color: var(--accent-dark); border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 650; }
  .viewbtns button.on { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  #views {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; padding: 4px; border-radius: 13px; white-space: nowrap;
  }
  #views button {
    border: 0; background: transparent; color: var(--ink); border-radius: 8px;
    padding: 8px 10px; min-height: 35px; font-size: 12px; font-weight: 650;
  }
  #views button[aria-pressed="true"] { background: var(--accent-dark); color: #fff; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  aside {
    /* position: relative держит скрытые чекбоксы переключателей внутри прокрутки панели. */
    position: relative; width: 370px; flex: none; overflow-y: auto; min-height: 0; overscroll-behavior: contain;
    padding: 1px 4px 10px 1px; scrollbar-color: #95c9c0 transparent;
  }
  aside section {
    margin-top: 12px; padding: 13px 13px 14px;
    border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow);
  }
  aside section:first-child { margin-top: 0; }
  h2 { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 9px; display: flex; justify-content: space-between; gap: 8px; }
  h2 span { text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 550; text-align: right; }
  h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 0 7px; display: flex; justify-content: space-between; }
  h3 span { color: var(--ink); }
  .types { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
  .types button, .seg button {
    border: 1px solid var(--line); background: #f7fcfa; color: var(--ink); border-radius: 9px;
    font-size: 12px; font-weight: 600; line-height: 1.25;
  }
  .types button { padding: 7px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .types button svg { width: 42px; height: 30px; }
  .types button svg rect { fill: #d3e9e3; }
  .types button svg path { fill: #466e72; }
  .types button svg path[fill="#d8d2c6"] { fill: #d3e9e3; }
  .types button small { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .types button.on, .seg.small button.on { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .types button.on svg path:not([fill="#d8d2c6"]) { fill: var(--accent); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; padding: 8px 7px; white-space: nowrap; }
  .seg button.on { border-color: var(--accent-dark); background: var(--accent-dark); color: #fff; }
  /* Профили: две строки по три — черепица и листовые. */
  #mats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); }
  .seg.small { margin-top: 7px; }
  .seg.small button { padding: 7px 6px; }
  #fence-dimensions { margin-top: 12px; }
  #export { background: var(--warm); border-color: var(--warm); color: #fff; }
  #share { background: var(--warm-light); border-color: #f2cbb7; color: #8f3218; }
  #action-status { font-size: 12px; line-height: 1.5; color: var(--muted); }
  #action-status:empty { margin-top: 0; }
  #share-url { width: 100%; margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: inherit; }
  .sw { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 7px; }
  .sw.f5 { grid-template-columns: repeat(5,minmax(0,1fr)); }
  .sw button { aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px #17313726; }
  .sw button.on { border-color: var(--accent-dark); box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--accent-light); }
  .row { margin-bottom: 12px; }
  .row label { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 4px; }
  .row label b { background: var(--accent-light); color: var(--accent-dark); border-radius: 5px; padding: 2px 6px; font-weight: 650; white-space: nowrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .tg { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #e8f3f0; font-size: 13px; cursor: pointer; user-select: none; }
  .tg:last-child { border-bottom: 0; }
  .tg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .tg i { width: 38px; height: 22px; border-radius: 11px; background: #b8ccce; position: relative; flex: none; transition: background .15s; }
  .tg i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px #17313740; }
  .tg input:checked + i { background: var(--accent); }
  .tg input:checked + i::after { transform: translateX(16px); }
  .slope-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px 8px; margin-bottom: 8px; min-width: 0; }
  .slope-controls legend { padding: 0 4px; font-size: 12px; font-weight: 650; color: var(--ink); }
  .slope-controls label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .slope-controls select { color: var(--ink); background: #f7fcfa; border: 1px solid var(--line); border-radius: 5px; font: inherit; min-height: 30px; padding: 3px 5px; }
  .slope-controls .dormer-toggle { grid-column: 1/-1; min-height: 25px; }
  .dormer-toggle input { accent-color: var(--accent); }
  .slope-controls small { grid-column: 1/-1; color: var(--muted); }
  .slope-controls small:empty { display: none; }
  .hint { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  @media (hover:hover) {
    .types button:hover, .seg button:not(.on):hover { border-color: var(--accent); }
    .viewbtns button:not(.on):hover, #views button:not([aria-pressed="true"]):hover { background: var(--accent-light); }
    #export:hover { background: #9b341a; }
  }
  @media (max-width:1040px) {
    .hud { max-width: calc(100% - 130px); }
    .viewbtns { flex-direction: column; gap: 5px; }
  }
  @media (max-width:820px) {
    .app-header { padding: 9px 12px; }
    .header-actions .seg button { min-height: 34px; padding: 6px 8px; font-size: 11px; }
    #workspace { flex-direction: column; gap: 9px; padding: 9px; }
    #view { flex: none; height: 50%; border-radius: 13px; }
    aside { width: 100%; flex: 1; padding: 1px 1px 10px; }
    #views { bottom: 8px; gap: 1px; }
    #views button { min-height: 32px; padding: 6px; font-size: 11px; }
    .hud { left: 10px; top: 10px; max-width: calc(100% - 128px); padding: 8px 10px; font-size: 11.5px; }
    .viewbtns { right: 10px; top: 10px; }
    .viewbtns button { padding: 7px 8px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .tg i, .tg i::after { transition: none; }
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>Примерка кровли</h1>
    <div class="header-actions">
      <div class="seg"><button id="share">Ссылка</button><button id="export">Сохранить PNG</button></div>
      <div class="action-details">
        <button id="dismiss-action" aria-label="Закрыть уведомление">×</button>
        <div id="action-status" role="status" aria-live="polite"></div>
        <input id="share-url" aria-label="Ссылка на конфигурацию" readonly hidden>
      </div>
    </div>
  </header>
  <main id="workspace">
    <div id="view">
      <canvas id="c" aria-label="Интерактивная 3D-модель дома" title="Перетащите для поворота. Прокрутка или щипок меняют масштаб."></canvas>
      <div id="loading">Загрузка 3D…</div>
      <div class="hud" id="stats"></div>
      <div class="viewbtns">
        <button id="rot">⟳ Вращать</button>
        <button id="reset">Сбросить вид</button>
        <button id="fullscreen" type="button" aria-controls="view">На весь экран</button>
      </div>
      <div id="views" role="group" aria-label="Ракурсы модели">
        <button data-view="overview" aria-pressed="false">Общий</button>
        <button data-view="front" aria-pressed="false">Спереди</button>
        <button data-view="side" aria-pressed="false">Сбоку</button>
        <button data-view="top" aria-pressed="false">Сверху</button>
        <button data-view="roof" aria-pressed="false">Кровля</button>
      </div>
    </div>
    <aside aria-label="Настройки дома, кровли и участка">
      <section>
        <h2>Форма крыши</h2>
        <div class="types" id="types"></div>
      </section>

      <section>
        <h2>Профиль кровли</h2>
        <div class="seg" id="mats"></div>
        <div id="falz-options" hidden>
          <h3>Полка фальцевой панели</h3>
          <div class="seg small" id="falz-pan"></div>
        </div>
        <div class="seg small" id="coats"></div>
      </section>

      <section>
        <h2>Цвет кровли <span id="ralname"></span></h2>
        <div class="sw" id="rals"></div>
      </section>

      <section>
        <h2>Элементы кровли</h2>
        <h3>Форма конька</h3>
        <div class="seg small" id="ridge-style"></div>
        <div id="toggles"></div>
        <div id="skysl" style="margin-top:12px"></div>
        <p class="hint">Окна и вентиляционные выходы можно перетаскивать по скату.</p>
        <h3>Цвет водостока</h3>
        <div class="seg small" id="gutcol"></div>
      </section>

      <section>
        <h2>Дом <span id="facname"></span></h2>
        <div class="sw f5" id="facade"></div>
        <h3>Цоколь <span id="plname"></span></h3>
        <div class="sw" id="plinth"></div>
        <h3>Окна и двери</h3>
        <div class="seg small" id="frames"></div>
        <h3>Выступы с эркерами</h3>
        <div class="seg small" id="bay-faces" role="group" aria-label="Выступы с эркерами по фасадам"></div>
      </section>

      <section>
        <h2>Размеры</h2>
        <div id="sliders"></div>
        <div id="overhang-note" class="sub" role="status" aria-live="polite"></div>
      </section>

      <section>
        <h2>Забор</h2>
        <div class="seg small" id="fence-styles" role="group" aria-label="Заполнение забора"></div>
        <div id="fence-options" hidden>
          <div id="fence-dimensions"></div>
          <h3>Столбы</h3>
          <div class="seg small" id="fence-posts" role="group" aria-label="Материал столбов"></div>
          <h3>Цвет забора <span id="fence-ral-name"></span></h3>
          <div class="sw" id="fence-colors" role="group" aria-label="Цвет забора RAL"></div>
        </div>
      </section>

      <section>
        <h2>Окружение</h2>
        <div class="row"><label for="hour"><span>Время суток</span><b id="hourv"></b></label><input type="range" id="hour" min="6.5" max="19.5" step="0.25"></div>
        <div id="envtoggles"></div>
      </section>
    </aside>
  </main>
</div>

<script type="module">
try {
const THREE = await import('three');
const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

/* ================= данные ================= */
const S = { type:'gable', mat:'tile', coat:'gloss', ral:'8017', W:8, L:10, H:3.2, A:30, O:0.5,
            facade:0, plinth:0, frames:0, trims:true, snow:true, gutter:true, trees:true, hour:15.5,
            skyN:1, skyPos:0.5, skylights:{}, gutCol:'roof', ridgeStyle:'round', falzPan:'plain', ventN:0, vents:{}, slopeWindows:null, slopeVents:null,
            fence:'none', fencePost:'metal', fenceRal:'8017', fenceHeight:1.9, bayFaces:[], slopeDormers:[] };

const TYPES = [
  { id:'shed',    name:'Односкатная', n:1, icon:'<rect x="9" y="15" width="24" height="13" fill="#d8d2c6"/><path d="M5 17 L37 5 L37 9 L5 21Z" fill="#45322E"/>' },

];
const MATS = {

  c21:    { name:'С21',       prof:1, per:0.100, height:0.021 },
  prof:   { name:'НС35',      prof:1, per:0.200, height:0.035 },

};
const COATS = {

};
const RAL = [
  ['3005','Винно-красный','#5E2129'],['3009','Оксидно-красный','#642424'],['3011','Коричнево-красный','#781F19'],
  ['8017','Шоколад','#45322E'],['8019','Серо-коричневый','#403A3A'],['8004','Медно-коричневый','#8E402A'],
  ['6005','Зелёный мох','#2F4538'],['6020','Хромовая зелень','#2E3A23'],['5005','Сигнальный синий','#154889'],

function encodeConfiguration(state, camera){
  return encodeURIComponent(JSON.stringify({v:1,state,camera}));
}
function decodeConfiguration(encoded){
  try {
    if(encoded.length > 12000) return null;
    const data = JSON.parse(decodeURIComponent(encoded));

float trapezoid(float d, float top, float foot){

}

// Синхронно с bavariaHeight в JS.
float bavariaWave(float u){
  // Сечение: выпуклый гребень одной дугой (без плоской вершины), скругление дна R60, плоское дно.
  // Константы считает bavariaSection() в JS — форма совпадает с сеткой.

  float t = fract(u/uPer);
  float x = min(t,1.0-t)*uPer;

  if(x<=A1) h = H - (RC - sqrt(max(RC*RC-x*x,0.0)));
  else if(x<=B) h = RT - sqrt(max(RT*RT-(B-x)*(B-x),0.0));

vec3 matteTexture(vec2 uv, vec2 footprint){
  const float grainScale = 75.0;
  const float fineScale = 155.0;

  float grainFade = 1.0-smoothstep(0.18,0.68,pixelSize*grainScale);
  if(grainFade<=0.0) return vec3(0.0);

  vec2 p = uv*grainScale;
  float baseGrain = (vnoise(p)-0.5)*grainFade;
  float fineFade = 1.0-smoothstep(0.18,0.68,pixelSize*fineScale);
  float fineGrain = (vnoise(uv*fineScale+vec2(19.0,7.0))-0.5)*fineFade;

  vec2 grainSlope = vec2(
    (vnoise(p+vec2(e.x,0.0))-vnoise(p-vec2(e.x,0.0)))/(2.0*e.x),
    (vnoise(p+vec2(0.0,e.y))-vnoise(p-vec2(0.0,e.y)))/(2.0*e.y)

const Y = new THREE.Vector3(0,1,0);
function newell(pts){
  const n = new THREE.Vector3();
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    n.x += (a.y-b.y)*(a.z+b.z); n.y += (a.z-b.z)*(a.x+b.x); n.z += (a.x-b.x)*(a.y+b.y);
  }
  return n;
}

// скат: оси U (вдоль карниза) и V (вверх по линии стока)
function slopeGeometry(ptsIn){
  let pts = ptsIn;
  const nRaw = newell(pts);
  const area = nRaw.length()/2;
  const n = nRaw.clone().normalize();
  if(n.y < 0){ pts = pts.slice().reverse(); n.negate(); }
  const Uv = new THREE.Vector3().crossVectors(n, Y).normalize();
  const Vv = new THREE.Vector3().crossVectors(n, Uv);
  if(Vv.y < 0){ Uv.negate(); Vv.negate(); }
  let o = pts[0]; for(const p of pts) if(p.y < o.y) o = p;
  o = o.clone();
  const uv = pts.map(p => { const d = p.clone().sub(o); return [d.dot(Uv), d.dot(Vv)]; });
  const pos=[], nor=[], su=[], sv=[], m=[];
  const push = (i) => {
    const p = pts[i];
    pos.push(p.x,p.y,p.z); nor.push(n.x,n.y,n.z);
    su.push(Uv.x,Uv.y,Uv.z); sv.push(Vv.x,Vv.y,Vv.z); m.push(uv[i][0], uv[i][1]);
  };
  for(let i=1;i<pts.length-1;i++){ push(0); push(i); push(i+1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('slopeU',   new THREE.Float32BufferAttribute(su,3));
  g.setAttribute('slopeV',   new THREE.Float32BufferAttribute(sv,3));
  g.setAttribute('aM',       new THREE.Float32BufferAttribute(m,2));
  g.setAttribute('reliefHeight', new THREE.Float32BufferAttribute(new Float32Array(pos.length/3),1));
  const centroid = pts.reduce((c,p) => c.add(p), new THREE.Vector3()).multiplyScalar(1/pts.length);
  return { g, area, pts, uv, n, U:Uv, V:Vv, o, centroid };
}

/* tile profile */
// Assembled standing seam: one narrow rolled lock per 515 mm panel.
function falzSection(){return [[0,.030],[.002,.030],[.004,.027],[.005,.008],[.008,.001],[.012,.001]];}
function falzHeight(u,v,pan='plain'){
  const t=((u/.515)%1+1)%1,d=Math.min(t,1-t)*.515;
  const section=falzSection();
  for(let i=1;i<section.length;i++){
    const [x,h]=section[i],[px,ph]=section[i-1];
    if(d<=x) return ph+(h-ph)*Math.max(0,Math.min(1,(d-px)/(x-px)));
  }
  const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
  const delta=Math.abs(d-.515/3);
  if(pan==='ribs' && delta<.004) return .001+.003*(.5+.5*Math.cos(Math.PI*delta/.004));
  if(pan==='narrow') return .001+.002*(1-smooth(.018,.020,delta));
  if(pan==='wide') return .001+.002*smooth(.1955,.1975,d);
  return .001;
}
function falzSamples(pan){
  const c=.515/3;
  return falzSection().map(p=>p[0]).concat(pan==='ribs' ? [c-.004,c-.002,c,c+.002,c+.004]
    : pan==='narrow' ? [c-.020,c-.018,c,c+.018,c+.020] : pan==='wide' ? [.1955,.1975] : [],[.2575]);
}
function falznastilPitch(){ return 0.330; }
function falznastilGrooves(){ return [0.068,0.133]; }
// The 330 mm panel has a 30 mm lock, based on the reference photo.
// Distances from the seam centre in metres; shared by mesh sampling and GLSL.
function falznastilSection(){
  // Two raised ribs flank a narrow channel that reaches the pan level.
  return [[0,.001],[.004,.001],[.007,.030],[.012,.030],[.017,.026],[.020,.025],[.027,.001],[.034,.001]];
}
function falznastilHeight(u,v){
  const pitch=falznastilPitch(),t=((u/pitch)%1+1)%1,d=Math.min(t,1-t)*pitch;
  const section=falznastilSection();
  for(let i=1;i<section.length;i++){
    const [x,h]=section[i],[prevX,prevH]=section[i-1];
    if(d<=x) return prevH+(h-prevH)*Math.max(0,Math.min(1,(d-prevX)/(x-prevX)));
  }
  const [inner,outer]=falznastilGrooves();
  const groove=Math.min(Math.abs(d-inner),Math.abs(d-outer));
  const k=Math.max(0,Math.min(1,(groove-.0005)/.0015));
  return .001-.0008*(1-k*k*(3-2*k));
}
// Metres: pressed wave + a short upstand at each 350 mm course.
// Keep in sync with hTile in the fragment shader.
function tileHeight(u,v){
  const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
  const wave=Math.pow(.5+.5*Math.cos(2*Math.PI*u/.1835),2.35);
  const row=((v/.35)%1+1)%1;
  const step=smooth(0,.018,row)*(1-smooth(.018,1,row));
  return .036*wave+.025*step;
}
// Бавария (чертёж производителя): ширина 1135/1020 мм, 4 волны на полезной ширине — шаг 255 мм,
// волна 44 мм, ступень ряда 30 мм (профиль 74 мм), ряд 350 мм.
// Сечение: выпуклый гребень одной дугой окружности от вершины до перегиба (без плоской вершины
// и прямых участков), затем скругление дна R60 и плоское дно 36 мм (ширина снята с чертежа).
// Одни и те же константы идут в сетку (bavariaHeight) и в шейдер (bavariaWave).
function bavariaSection(){
  // Считается один раз: функция вызывается для каждой вершины сетки.
  if(bavariaSection.cache) return bavariaSection.cache;
  const P=.255,H=.044,Rt=.060,ft=.018,lip=.030,s=P/2-ft;
  // Две касательные дуги: (Rc+Rt)(1−cos θ) = H, (Rc+Rt)·sin θ = s.
  const theta=2*Math.atan(H/s), Rc=s/Math.sin(theta)-Rt;
  return bavariaSection.cache={P,H,Rc,Rt,ft,lip,theta,a1:Rc*Math.sin(theta),b:P/2-ft};
}
function bavariaHeight(u,v){
  const B=bavariaSection();
  const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
  const t=((u/B.P)%1+1)%1, x=Math.min(t,1-t)*B.P;
  let h;
  if(x<=B.a1) h=B.H-(B.Rc-Math.sqrt(Math.max(B.Rc*B.Rc-x*x,0)));
  else if(x<=B.b) h=B.Rt-Math.sqrt(Math.max(B.Rt*B.Rt-(B.b-x)**2,0));
  else h=0;
  const row=((v/.35)%1+1)%1;
  return h+B.lip*smooth(0,.06,row)*(1-smooth(.06,1,row));
}
/* end tile profile */

// Match the GLSL profiles so highlights follow the displaced surface.
function roofProfileHeight(u,v,material){
  if(material.prof===2) return falzHeight(u,v,material.pan);
  if(material.prof===5) return falznastilHeight(u,v);
  if(material.prof===0) return tileHeight(u,v);
  if(material.prof===4) return bavariaHeight(u,v);
  const d = Math.abs(((u/material.per)%1+1)%1-0.5)*material.per;
  const trapezoid = (top,foot) => Math.max(0,Math.min(1,(foot-d)/(foot-top)));
  if(material.prof===1){
    return material.per<0.15 ? material.height*trapezoid(0.0175,0.0325) : material.height*trapezoid(0.035,0.055);
  }
  const row = ((v/.35)%1+1)%1;
  const step = Math.min(row/0.016,(1-row)/0.984);
  return 0.025*trapezoid(0.055,0.074)+0.020*step;
}

function roofReliefGeometry(s, material, quality='overview'){
  const detailed = quality==='detail';
  const straight = material.prof===1 || material.prof===2 || material.prof===5;
  // For profiled sheets, slice parallel to the ribs so they stay straight on hips.
  const section = straight ? {uv:s.uv.map(([u,v]) => [v,u])} : s;
  const low = Math.min(...section.uv.map(p=>p[1]));
  const high = Math.max(...section.uv.map(p=>p[1]));
  const left = Math.min(...section.uv.map(p=>p[0]));
  const right = Math.max(...section.uv.map(p=>p[0]));
  const heights = new Set(section.uv.map(p=>p[1]));
  const pitch = straight ? material.per : 0.35;
  const fractions = straight
    ? (material.prof===2 ? falzSamples(material.pan).flatMap(x=>[x/pitch,1-x/pitch]) : material.prof===5
      ? [...falznastilSection().map(p=>p[0]),...falznastilGrooves().flatMap(x=>[x-.002,x-.0005,x+.0005,x+.002]),pitch/2].flatMap(x=>[x/pitch,1-x/pitch])
      : pitch < 0.15 ? [0.175,0.325,0.675,0.825] : [0.225,0.325,0.675,0.775])
    : material.prof===3 ? [0,.016,.5]
    : material.prof===4 ? (detailed ? [0,.01,.02,.03,.045,.06,.09,.15,.27,.47,.72] : [0,.02,.06,.15,.45,.75])
    : detailed ? [0,.006,.012,.018,.05,.10,.20,.40,.65,.88] : [0,.006,.018,.10,.40,.70];
  for(let row=Math.floor(low/pitch);row*pitch<high;row++) for(const fraction of fractions){
    const v=(row+fraction)*pitch;
    if(v>low && v<high) heights.add(v);
  }
  const rows=[...heights].sort((a,b)=>a-b).filter((v,i,a)=>i===0 || v-a[i-1]>1e-7);
  // Черепица: не больше 32 000 треугольников на скат в общем виде и 96 000 вблизи.
  const budget = detailed ? 96000 : 32000;
  const columns = straight ? 1 : Math.max(1,Math.min(Math.ceil((right-left)/(material.per/(material.prof===4 ? (detailed?24:12) : (detailed?12:6)))),Math.floor(budget/(2*Math.max(1,rows.length-1)))));
  const pos=[],nor=[],su=[],sv=[],meters=[],relief=[],indices=[];
  for(const row of rows){
    const [lo,hi]=spanAt(section,row);
    for(let col=0;col<=columns;col++){
      let sample;
      if(col===0) sample=lo;
      else if(col===columns) sample=hi;
      else sample=Math.max(lo,Math.min(hi,left+(right-left)*col/columns));
      const [u,v]=straight ? [row,sample] : [sample,row];
      const h=roofProfileHeight(u,v,material);
      relief.push(h);
      pos.push(s.o.x+s.U.x*u+s.V.x*v+s.n.x*h,s.o.y+s.U.y*u+s.V.y*v+s.n.y*h,s.o.z+s.U.z*u+s.V.z*v+s.n.z*h);
      nor.push(s.n.x,s.n.y,s.n.z);su.push(s.U.x,s.U.y,s.U.z);sv.push(s.V.x,s.V.y,s.V.z);meters.push(u,v);
    }
  }
  for(let row=0;row<rows.length-1;row++) for(let col=0;col<columns;col++){
    const a=row*(columns+1)+col,b=a+1,c=a+columns+1,d=c+1;
    if(straight) indices.push(a,d,b,a,c,d);
    else indices.push(a,b,d,a,d,c);
  }
  const g=new THREE.BufferGeometry();
  for(const [name,data,size] of [['position',pos,3],['normal',nor,3],['slopeU',su,3],['slopeV',sv,3],['aM',meters,2],['reliefHeight',relief,1]]) g.setAttribute(name,new THREE.Float32BufferAttribute(data,size));
  g.setIndex(indices);g.computeBoundingSphere();
  return g;
}

function flatGeometry(pts){
  const n = newell(pts).normalize();
  const pos=[], nor=[];
  for(let i=1;i<pts.length-1;i++) for(const p of [pts[0],pts[i],pts[i+1]]){ pos.push(p.x,p.y,p.z); nor.push(n.x,n.y,n.z); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));

function rod(a, b, r, mat, seg=12){
  const dir = b.clone().sub(a); const len = dir.length();
  if(len < 0.005) return null;
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(Y, dir.normalize());
  mesh.castShadow = true;

function orientedBox(lx, ly, lz, X, Yv, center, mat){
  const x = X.clone().normalize();
  const z = new THREE.Vector3().crossVectors(x, Yv).normalize();
  const y = new THREE.Vector3().crossVectors(z, x).normalize();
  const m = new THREE.Mesh(new THREE.BoxGeometry(lx, ly, lz), mat);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  m.position.copy(center); m.castShadow = true;

function addSnowGuard(s,v,min,max){

  const lumen = new THREE.Path();
  lumen.absellipse(0,0,tubeHalfWidth-0.003,tubeHalfHeight-0.003,0,Math.PI*2,true);
  tube.holes.push(lumen);
  for(const height of tubeHeights){
    const geometry = extrusion(tube,max-min);
    geometry.translate(0,height,0);
    mount(geometry,min);
  }

  const bracket = new THREE.Shape();
  bracket.moveTo(-0.22,0.014);
  bracket.quadraticCurveTo(-0.224,0.065,-0.183,0.076);
  bracket.lineTo(-0.071,0.102);
  bracket.quadraticCurveTo(-0.043,0.108,-0.041,0.152);
  bracket.quadraticCurveTo(-0.043,0.207,0,0.207);
  bracket.quadraticCurveTo(0.043,0.207,0.041,0.152);
  bracket.quadraticCurveTo(0.043,0.108,0.071,0.102);
  bracket.lineTo(0.183,0.076);
  bracket.quadraticCurveTo(0.224,0.065,0.22,0.014);
  bracket.closePath();
  for(const [x,y,rx,ry] of [
    ...tubeHeights.map(height=>[0,height,tubeHalfWidth+0.0015,tubeHalfHeight+0.0015]),
    [-0.14,0.045,0.006,0.012],[-0.075,0.049,0.006,0.012],
    [0.075,0.049,0.006,0.012],[0.14,0.045,0.006,0.012]
  ]){
    const hole = new THREE.Path();
    hole.absellipse(x,y,rx,ry,0,Math.PI*2,false);
    bracket.holes.push(hole);
  }
  const count = Math.ceil((max-min-0.24)/0.9)+1;
  const supports = new THREE.InstancedMesh(extrusion(bracket,0.008),trimMat,count);
  const transform = new THREE.Matrix4().makeBasis(s.V,s.n,s.U);
  supports.castShadow = supports.receiveShadow = true;
  for(let i=0;i<count;i++){
    const u = min+0.12+(max-min-0.24)*i/(count-1);
    const center = s.o.clone().addScaledVector(s.U,u).addScaledVector(s.V,v);
    supports.setMatrixAt(i,transform.setPosition(center.clone().addScaledVector(s.U,-0.004)));
    const foot = center.addScaledVector(s.n,0.012);
    house.add(orientedBox(0.046,0.016,0.46,s.U,s.n,foot,trimMat));
  }
  house.add(supports);
}

function sheetProfile(profile, a, b, across, material, {endShift = [0, 0], up = Y, group = house} = {}){
  const shape = new THREE.Shape(profile.map(([x,y]) => new THREE.Vector2(x,y)));
  const length = a.distanceTo(b);
  const g = new THREE.ExtrudeGeometry(shape, {depth:length, bevelEnabled:false});
  const position = g.getAttribute('position');
  for(let i=0;i<position.count;i++){
    const x = position.getX(i), z = position.getZ(i);
    position.setZ(i, z + x*endShift[z > length/2 ? 1 : 0]);
  }
  const along = b.clone().sub(a).normalize();
  g.applyMatrix4(new THREE.Matrix4().makeBasis(across, up, along).setPosition(a));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, material);
  mesh.castShadow = mesh.receiveShadow = true;
  group.add(mesh);
}

// Штампованные рёбра огибают верх конька и выходят на боковые полки.
function addRidgeBeads(profile, a, b, across, up){
  const length = a.distanceTo(b);
  if(length < 0.12) return;
  const along = b.clone().sub(a).normalize();
  const pitch = 0.316;
  const halfWidth = 0.018;
  const margin = 0.05;
  const count = Math.floor((length-2*margin)/pitch)+1;
  const first = (length-(count-1)*pitch)/2;
  const sections = 8;
  const positions = [], indices = [];
  const contour = profile.map(([x,y],i) => {
    const prev = profile[Math.max(0,i-1)], next = profile[Math.min(profile.length-1,i+1)];
    const tangentX = next[0]-prev[0], tangentY = next[1]-prev[1];
    const span = Math.hypot(tangentX,tangentY);
    return {x,y,nx:-tangentY/span,ny:tangentX/span};
  });

  for(let rib=0;rib<count;rib++){
    const center = first+rib*pitch;
    const start = positions.length/3;
    for(let row=0;row<=sections;row++){
      const fraction = 2*row/sections-1;
      const z = center+halfWidth*fraction;
      const height = 0.010*Math.cos(fraction*Math.PI/2)**2-0.0015;
      for(const [i,{x,y,nx,ny}] of contour.entries()){
        const u = x+height*nx, v = y+height*ny;
        positions.push(u,v,z);
        if(row<sections && i<contour.length-1){
          const p = start+row*contour.length+i;
          const q = p+contour.length;
          indices.push(p,q,p+1,p+1,q,q+1);
        }
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geometry.setIndex(indices);
  geometry.applyMatrix4(new THREE.Matrix4().makeBasis(across,up,along).setPosition(a));
  geometry.computeVertexNormals();
  const beads = new THREE.Mesh(geometry,trimMat);
  beads.castShadow = beads.receiveShadow = true;
  house.add(beads);
}

function addRidgeCap(a, b, slopes){
  const along = b.clone().sub(a).normalize();
  const across = new THREE.Vector3().crossVectors(Y, along).normalize();
  const up = new THREE.Vector3().crossVectors(along, across);
  const center = a.clone().lerp(b, 0.5);
  const side = sign => slopes.find(s => sign*across.dot(s.centroid.clone().sub(center)) > 0);
  const slopeSection = sign => {
    const slope = side(sign);
    const normalUp = slope ? slope.n.dot(up) : 1;
    const grade = slope ? -slope.n.dot(across)/normalUp : 0;
    const clearance = slope ? Math.max(0.060, MATS.tile.height/normalUp+0.009) : 0.060;
    return {slope, grade, clearance, normalUp};
  };
  const left = slopeSection(-1), right = slopeSection(1);
  // Оформление конька применяется там, где скаты расходятся вниз.
  const isRidge = slopes.length === 2 && left.grade >= 0 && right.grade <= 0;
  const rectangular = isRidge && S.ridgeStyle==='rect';
  const rounded = isRidge && !rectangular;
  const halfWidth = 0.0825, crownHeight = 0.075;
  const ridgeFlatHalfWidth = 0.015;
  const flange = ({slope,grade,clearance}, sign) => {
    const gradeFactor = Math.hypot(1,grade);
    let reach = 0.23/gradeFactor;
    if(rectangular) reach = ridgeFlatHalfWidth+0.115/gradeFactor;
    const x = sign*(slope ? reach : 0.055);
    const y = x*grade;
    return [[x,y+(slope ? clearance-0.019 : -0.075)], [x,y+clearance]];
  };
  const base = Math.max(left.clearance,right.clearance)+0.005;
  let crown = [[0,base]];
  // Measure clearance perpendicular to each slope, including the tallest roofing relief.
  const ridgeClearance = MATS.tile.height+0.007;
  const seat = (section, x) => x*section.grade + ridgeClearance/section.normalUp;
  if(rounded){
    const leftSeat = seat(left,-halfWidth), rightSeat = seat(right,halfWidth);
    const rise = Math.max(crownHeight,base-(leftSeat+rightSeat)/2);
    crown = Array.from({length:37}, (_, i) => {
      const angle = Math.PI*(1-i/36);
      const x = halfWidth*Math.cos(angle);
      const springline = leftSeat+(rightSeat-leftSeat)*(x+halfWidth)/(2*halfWidth);
      return [x,springline+rise*Math.sin(angle)];
    });
  }
  if(rectangular){
    const x = ridgeFlatHalfWidth, top = base+0.025;
    crown = [
      [-x,left.clearance-x*left.grade], [-x,top],
      [x,top], [x,right.clearance+x*right.grade]
    ];
  }
  const profile = rounded
    ? [[-0.1125,seat(left,-0.1125)], ...crown, [0.1125,seat(right,0.1125)]]
    : [...flange(left,-1), ...crown, ...flange(right,1).reverse()];
  const thickness = rounded ? 0.002 : 0.008;
  const shell = points => [...points, ...points.slice().reverse().map(([x,y]) =>
    [x-Math.sign(x)*thickness, y-thickness])];
  if(rounded){
    const drop = 0.005;
    const start = a.clone().addScaledVector(Y,-drop);
    const end = b.clone().addScaledVector(Y,-drop);
    sheetProfile(shell(profile), start, end, across, trimMat, {up});
    addRidgeBeads(profile, start, end, across, up);
    return;
  }
  sheetProfile(shell(profile), a, b, across, trimMat, {up});
  const length = a.distanceTo(b);
  const sections = Math.ceil(length/2);
  const lap = shell(profile.map(([x,y]) => [x*1.02,y+0.01]));
  for(let i=1;i<sections;i++){
    const point = a.clone().lerp(b, i/sections);
    sheetProfile(lap, point, point.clone().addScaledVector(along, 0.035), across, trimMat, {up});
  }
}

const gutterRadius = 0.085, gutterThickness = 0.008, pipeRadius = 0.048;
function gutterProfile(radius, thickness){
  const arc = (r, reverse) => Array.from({length:17}, (_, i) => {
    const angle = Math.PI*(reverse ? 16-i : i)/16;
    return [r*Math.cos(angle), -r*Math.sin(angle)];
  });
  return [...arc(radius, false), ...arc(radius-thickness, true)];
}

function addGutter(e, eaves, overhang){
  // Keep the inner lip under the roof edge so runoff lands inside the channel.
  const center = p => p.clone().addScaledVector(e.out, 0.055).addScaledVector(Y, -0.045);
  const along = new THREE.Vector3().crossVectors(e.out, Y);
  const forward = along.dot(e.b.clone().sub(e.a)) > 0;
  const [start,end] = forward ? [e.a,e.b] : [e.b,e.a];
  const a = center(start), b = center(end);
  const mate = p => eaves.find(other => other !== e && (p.equals(other.a) || p.equals(other.b)));
  const joints = [mate(start), mate(end)];
  const endShift = joints.map(other => other ? along.dot(other.out) : 0);
  a.addScaledVector(along, 0.055*endShift[0]);
  b.addScaledVector(along, 0.055*endShift[1]);
  sheetProfile(gutterProfile(gutterRadius, gutterThickness), a, b, e.out, gutterMat, {endShift});
  for(const x of [-gutterRadius+0.009, gutterRadius-0.009]){
    const lipPoint = (p, i) => p.clone().addScaledVector(e.out, x).addScaledVector(along, x*endShift[i]);
    house.add(rod(lipPoint(a,0), lipPoint(b,1), 0.009, gutterMat, 8));
  }
  const endCap = gutterProfile(gutterRadius,gutterThickness).slice(0,17);
  if(!joints[0]) sheetProfile(endCap, a, a.clone().addScaledVector(along, 0.012), e.out, gutterMat);
  if(!joints[1]) sheetProfile(endCap, b.clone().addScaledVector(along, -0.012), b, e.out, gutterMat);

  const fascia = start.clone().lerp(end, 0.5).addScaledVector(e.out,-0.024).addScaledVector(Y,-0.075);
  house.add(orientedBox(e.len,0.13,0.035,along,Y,fascia,trimMat));

  const brackets = Math.ceil(e.len/0.95);
  const saddle = gutterProfile(gutterRadius+0.011, 0.012);
  for(let i=0;i<brackets;i++){
    const point = center(start).addScaledVector(along, e.len*(i+0.5)/brackets);
    sheetProfile(saddle, point, point.clone().addScaledVector(along, 0.03), e.out, gutterMat);
  }
  const outlet = overhang+0.52;
  addDownspout(center(start).addScaledVector(along, outlet), e.out, overhang);
  if(e.len > 12) addDownspout(center(end).addScaledVector(along, -outlet), e.out, overhang);
}

function addDownspout(gutter, out, overhang){
  const top = gutter.clone().addScaledVector(Y, -gutterRadius+0.035);
  const neck = top.clone().addScaledVector(Y, -0.14);
  const bend = neck.clone().addScaledVector(Y, -0.14);
  const wall = bend.clone().addScaledVector(out, -(overhang+0.055-0.12));
  wall.y -= Math.max(0.22, (overhang-0.065)*0.64);
  const foot = wall.clone(); foot.y = 0.40;
  const exit = foot.clone().addScaledVector(out, 0.23).addScaledVector(Y,-0.125);
  if(wall.y <= foot.y+0.18) return;

  const funnel = new THREE.Mesh(new THREE.CylinderGeometry(0.066, pipeRadius+0.006, 0.14, 20, 1, true), gutterMat);
  funnel.position.copy(top).lerp(neck,0.5);
  funnel.castShadow = true;
  house.add(funnel);

  const path = new THREE.CurvePath();
  let from = neck;
  const corners = [bend, wall, foot];
  const couplings = [[neck,Y]];
  for(const [i,corner] of corners.entries()){
    const next = corners[i+1] || exit;
    const tangent = corner.clone().sub(from).normalize();
    const before = corner.clone().addScaledVector(tangent, -0.09);
    const after = corner.clone().addScaledVector(next.clone().sub(corner).normalize(), 0.09);
    path.add(new THREE.LineCurve3(from, before));
    path.add(new THREE.QuadraticBezierCurve3(before, corner, after));
    couplings.push([before,tangent]);
    from = after;
  }
  path.add(new THREE.LineCurve3(from, exit));
  const pipe = new THREE.Mesh(new THREE.TubeGeometry(path, Math.ceil(path.getLength()*32), pipeRadius, 16), gutterMat);
  pipe.castShadow = pipe.receiveShadow = true;
  house.add(pipe);

  const pipeRing = (point, tangent, radius, thickness) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, thickness, 6, 20), gutterMat);
    ring.position.copy(point);
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), tangent);
    house.add(ring);
  };
  for(const [point,tangent] of couplings) pipeRing(point, tangent, pipeRadius, 0.006);
  const direction = exit.clone().sub(foot).normalize();
  const mouth = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius-0.005, pipeRadius-0.005, 0.075, 16, 1, true),
    gutterMat);
  mouth.geometry.scale(-1,1,1);
  mouth.geometry.computeVertexNormals();
  mouth.position.copy(exit).addScaledVector(direction,-0.037);
  mouth.quaternion.setFromUnitVectors(Y,direction);
  house.add(mouth);
  pipeRing(exit, direction, pipeRadius-0.001, 0.005);

  const count = Math.ceil((wall.y-0.80)/1.55);
  for(let i=0;i<count;i++){
    const point = wall.clone();
    point.y = 0.68+(wall.y-0.80)*(i+0.5)/count;
    const band = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius+0.009, pipeRadius+0.009, 0.032, 16, 1, true), gutterMat);
    band.position.copy(point);
    house.add(band, orientedBox(0.055, 0.048, 0.095, new THREE.Vector3().crossVectors(Y,out), Y,
      point.clone().addScaledVector(out,-0.074), gutterMat));
  }
}

// Модель крыши в локальных осях: p — поперёк короткой стороны, q — вдоль длинной
function roofModel(){
  const { W, L, H } = S;
  // Retain the requested wall height and slope: constrain the horizontal overhang.
  const lowerTangent=Math.tan(Math.min(75,S.A+35)*Math.PI/180);
  const maxOverhang=S.type==='gambrel' ? Math.max(.2,Math.min(.9,Math.floor(((H-1.8)/lowerTangent+1e-9)*20)/20)) : .9;
  const O=Math.min(S.O,maxOverhang);
  const t = Math.tan(S.A*Math.PI/180);
  const short = Math.min(W,L), long = Math.max(W,L);
  const swap = W > L;
  const P0 = (p,y,q) => swap ? new THREE.Vector3(q,y,p) : new THREE.Vector3(p,y,q);
  const P = P0;
  const a = short/2 + O, b = long/2 + O, hs = short/2, hl = long/2;
  const slopes=[], walls=[], ridges=[];
  let y0 = H - O*t, pitchText = `${S.A}°`;
  switch(S.type){
    case 'shed': {
      const yh = y0 + 2*a*t;
      const P = (p,y,q) => P0(-p,y,q); // низкий карниз — к камере
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(a,yh,b),P(a,yh,-b)]);
      for(const q of [-hl,hl]) walls.push([P(-hs,H,q),P(hs,H,q),P(hs,H+short*t,q)]);
      walls.push([P(hs,H,-hl),P(hs,H,hl),P(hs,H+short*t,hl),P(hs,H+short*t,-hl)]);
      ridges.push([P(a,yh,-b),P(a,yh,b)]);
      break;
    }
    case 'gable': {
      const yr = y0 + a*t;
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(0,yr,b),P(0,yr,-b)]);
      slopes.push([P(a,y0,-b),P(0,yr,-b),P(0,yr,b),P(a,y0,b)]);
      for(const q of [-hl,hl]) walls.push([P(-hs,H,q),P(hs,H,q),P(0,H+hs*t,q)]);
      ridges.push([P(0,yr,-b),P(0,yr,b)]);
      break;
    }
    case 'hip': {
      const yr = y0 + a*t, r = b - a;
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(0,yr,r),P(0,yr,-r)]);
      slopes.push([P(a,y0,b),P(a,y0,-b),P(0,yr,-r),P(0,yr,r)]);
      slopes.push([P(-a,y0,b),P(a,y0,b),P(0,yr,r)]);
      slopes.push([P(a,y0,-b),P(-a,y0,-b),P(0,yr,-r)]);
      if(r > 0.01) ridges.push([P(0,yr,-r),P(0,yr,r)]);
      for(const [sp,sq,rq] of [[-1,1,r],[1,1,r],[-1,-1,-r],[1,-1,-r]]) ridges.push([P(sp*a,y0,sq*b),P(0,yr,rq)]);
      break;
    }
    case 'pyramid': {
      const yr = y0 + a*t, apex = P(0,yr,0);
      const c = [P(-a,y0,-b),P(-a,y0,b),P(a,y0,b),P(a,y0,-b)];
      for(let i=0;i<4;i++){ slopes.push([c[i],c[(i+1)%4],apex]); ridges.push([c[i],apex]); }
      if(Math.abs(long-short) > 0.01) pitchText = `${S.A}° / ${Math.round(Math.atan((yr-y0)/b)*180/Math.PI)}°`;
      break;
    }
    case 'gambrel': {
      const beta = Math.min(75, S.A + 35)*Math.PI/180, tb = Math.tan(beta);
      y0 = H - O*tb;
      let d = Math.max(O + 0.35, a*0.32); d = Math.min(d, a - 0.6);
      const yb = y0 + d*tb, k = a - d, yr = yb + k*t;
      slopes.push([P(-a,y0,-b),P(-a,y0,b),P(-k,yb,b),P(-k,yb,-b)]);
      slopes.push([P(-k,yb,-b),P(-k,yb,b),P(0,yr,b),P(0,yr,-b)]);
      slopes.push([P(a,y0,b),P(a,y0,-b),P(k,yb,-b),P(k,yb,b)]);
      slopes.push([P(k,yb,b),P(k,yb,-b),P(0,yr,-b),P(0,yr,b)]);
      for(const q of [-hl,hl]) walls.push([P(-hs,H,q),P(hs,H,q),P(k,yb,q),P(0,yr,q),P(-k,yb,q)]);
      ridges.push([P(0,yr,-b),P(0,yr,b)]);
      ridges.push([P(-k,yb,-b),P(-k,yb,b)]);
      ridges.push([P(k,yb,-b),P(k,yb,b)]);
      pitchText = `${S.A}° / ${Math.round(beta*180/Math.PI)}°`;
      break;
    }
  }
  return { slopes, walls, ridges, y0, pitchText, effectiveOverhang:O, maxOverhang };
}

const house = new THREE.Group();
const envGroup = new THREE.Group();
const fenceGroup = new THREE.Group();
const roofSurfaceMeshes = [];
const skylightMeshes = [];
const roofVents = [];
let tileQuality='overview';
let needsRender=true;
// Черепичные профили (Монтеррей, Каскад) имеют два уровня сетки; профнастил и фальц от него не зависят.
const qualityDependent = () => [0,3,4].includes(MATS[S.mat].prof);
function refreshRoofDetail(preferred){
  const ratio=camera.position.distanceTo(controls.target)/Math.max(S.W,S.L);
  const next=preferred || (ratio<1.4 ? 'detail' : ratio>2 ? 'overview' : tileQuality);
  if(next===tileQuality) return;
  tileQuality=next;
  if(!qualityDependent()) return;
  for(const {mesh,s} of roofSurfaceMeshes){
    mesh.geometry.dispose();mesh.geometry=roofReliefGeometry(s,MATS[S.mat],tileQuality);s.g=mesh.geometry;
  }
  needsRender=true;
}
let detailTimer;
controls.addEventListener('end',()=>{clearTimeout(detailTimer);detailTimer=setTimeout(()=>refreshRoofDetail(),180);});
scene.add(house, envGroup, fenceGroup);

function clearGroup(g){
  g.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    if(o.isInstancedMesh) o.dispose();
  });
  g.clear();
}

function addOpening(c, nrm, tan, off, y, w, h, kind){
  const base = c.clone().addScaledVector(tan, off); base.y = y;
  const look = (m, push) => { m.position.copy(base).addScaledVector(nrm, push); m.lookAt(m.position.clone().add(nrm)); house.add(m); };
  if(kind === 'door'){
    look(new THREE.Mesh(new THREE.PlaneGeometry(w+0.16, h+0.08), frameMat), 0.012);
    look(new THREE.Mesh(new THREE.PlaneGeometry(w, h), doorMat), 0.02);
    const handle=new THREE.Mesh(new THREE.BoxGeometry(.035,.22,.045),skyFrameMat);
    look(handle,.065);handle.position.addScaledVector(tan,w*.32);
    const canopy = new THREE.Mesh(new THREE.BoxGeometry(w+0.8, 0.06, 0.9), trimMat);
    canopy.position.copy(base).addScaledVector(nrm, 0.45); canopy.position.y = y + h/2 + 0.35;
    canopy.lookAt(canopy.position.clone().add(nrm)); canopy.castShadow = true; house.add(canopy);
    const step = new THREE.Mesh(new THREE.BoxGeometry(w+0.8, 0.3, 1.0), plinthMat);
    step.position.copy(base).addScaledVector(nrm, 0.5); step.position.y = 0.15;
    step.lookAt(step.position.clone().add(nrm)); step.castShadow = step.receiveShadow = true; house.add(step);
  } else {
    // Raised frame surrounds a recessed pane; real depth catches sun and shadow.
    look(new THREE.Mesh(new THREE.PlaneGeometry(w+0.16,h+0.16),frameMat),0.012);
    look(new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat),0.025);
    for(const x of [-w/2-.035,w/2+.035]){
      const frame=new THREE.Mesh(new THREE.BoxGeometry(.07,h+.16,.10),frameMat);
      look(frame,.055);frame.position.addScaledVector(tan,x);frame.castShadow=true;
    }
    for(const yOff of [-h/2-.035,h/2+.035]){
      const frame=new THREE.Mesh(new THREE.BoxGeometry(w,.07,.10),frameMat);
      look(frame,.055);frame.position.y+=yOff;frame.castShadow=true;
    }
    const mullion=new THREE.Mesh(new THREE.BoxGeometry(.055,h,.075),frameMat);
    look(mullion,.065);mullion.castShadow=true;
    const sill = new THREE.Mesh(new THREE.BoxGeometry(w+0.3, 0.05, 0.24), frameMat);
    sill.position.copy(base).addScaledVector(nrm, 0.07); sill.position.y = y - h/2 - 0.08;
    sill.lookAt(sill.position.clone().add(nrm)); house.add(sill);
  }
}

const fenceSetback = 3;
let fenceKey = '';
const picketWidth = 0.13;
function picketCenters(width){
  if(width<picketWidth) return [];
  const count = Math.min(Math.round((width+0.035)/(picketWidth+0.035)),
    Math.floor((width+0.020)/(picketWidth+0.020)));
  if(count<=1) return [0];
  const gap = Math.min(0.050,(width-count*picketWidth)/(count-1));
  return Array.from({length:count},(_,i)=>(i-(count-1)/2)*(picketWidth+gap));
}

function faceOpeningCount(length){
  return Math.max(1,Math.floor(length/3.1));
}

function frontDoorX(){
  const count = faceOpeningCount(S.W);
  return -S.W/2 + (S.W/count)*(Math.floor(count/2)+0.5);
}

function buildFence(){
  const key = [S.fence, S.fencePost, S.fenceHeight, S.W, S.L].join(':');
  if(key === fenceKey) return;
  fenceKey = key;
  needsRender = true;
  clearGroup(fenceGroup);
  if(S.fence === 'none') return;

  const hx = S.W/2 + fenceSetback, hz = S.L/2 + fenceSetback;
  const stone = S.fencePost === 'stone';
  const postWidth = stone ? 0.42 : 0.10;
  const capHeight = 0.05;
  const postHeight = S.fenceHeight-capHeight;
  const bottom = 0.12, top = postHeight-0.11, panelHeight = top-bottom;
  const boxes = new Map();
  const pickets = [];
  const transform = new THREE.Matrix4();
  const zAxis = new THREE.Vector3();
  function box(mat, center, width, height, depth, tan, tilt = 0){
    const rotation = new THREE.Matrix4().makeBasis(tan, Y, zAxis.crossVectors(tan,Y));
    if(tilt) rotation.multiply(new THREE.Matrix4().makeRotationX(tilt));
    transform.copy(rotation).scale(new THREE.Vector3(width,height,depth)).setPosition(center);
    if(!boxes.has(mat)) boxes.set(mat, []);
    boxes.get(mat).push(transform.clone());
  }

  function addPost(at, tan){
    const base = at.clone(); base.y = postHeight/2;
    if(stone){
      const post = orientedBox(postWidth,postHeight,postWidth,tan,Y,base,fenceStoneMat);
      post.receiveShadow = true;
      fenceGroup.add(post);
    } else box(fenceMetalMat,base,postWidth,postHeight,postWidth,tan);
    base.y = postHeight + capHeight/2;
    const cap = postWidth + (stone ? 0.085 : 0.026);
    box(fenceMetalMat,base,cap,capHeight,cap,tan);
  }

  function addPanel(center, tan, width, gate){
    const out = new THREE.Vector3().crossVectors(tan,Y);
    const at = (x,y,z=0) => center.clone().addScaledVector(tan,x).addScaledVector(Y,y).addScaledVector(out,z);
    for(const y of [bottom+0.18,top-0.18]){
      box(fenceMetalMat,at(0,y,-0.047),width,0.055,0.072,tan);
    }
    if(S.fence === 'corrugated'){
      const cells = Math.ceil(width/0.12), pitch = width/cells;
      const front = [];
      for(let i=0;i<cells;i++){
        for(const [offset,z] of [[0,0],[0.24,0],[0.40,0.031],[0.64,0.031],[0.80,0]]){
          front.push([(i+offset)*pitch,-z]);
        }
      }
      front.push([width,0]);
      const back = front.slice().reverse().map(([x,z])=>[x,z+0.012]);
      sheetProfile([...front,...back],at(-width/2,bottom),at(-width/2,top),tan,fencePanelMat,
        {up:out.clone().negate(),group:fenceGroup});
    } else if(S.fence === 'picket'){
      const usable = gate ? width-0.096 : width;
      for(const x of picketCenters(usable)){
        const placement = new THREE.Matrix4().makeBasis(tan,Y,out).setPosition(at(x,bottom,-0.019));
        pickets.push(placement);
        for(const rib of [-0.031,0,0.031]){
          box(fencePanelMat,at(x+rib,(bottom+top-0.025)/2,0.020),0.010,panelHeight-0.025,0.006,tan);
        }
      }
    } else {
      const siding = S.fence === 'siding';
      const count = Math.round(panelHeight/(siding ? 0.18 : 1.62/11));
      const pitch = panelHeight/count;
      if(siding) box(fenceMetalMat,at(0,(bottom+top)/2,-0.034),width,panelHeight,0.024,tan);
      for(let i=0;i<count;i++){
        box(fencePanelMat,at(0,bottom+(i+0.5)*pitch),width,pitch*(siding ? 0.98 : 0.82),
          siding ? 0.035 : 0.075,tan,siding ? -0.13 : -0.45);
      }
    }
    if(gate){
      for(const x of [-width/2+0.024,width/2-0.024]){
        box(fenceMetalMat,at(x,(bottom+top)/2,0.03),0.048,panelHeight,0.065,tan);
      }
      for(const y of [bottom,top]) box(fenceMetalMat,at(0,y,0.03),width,0.045,0.065,tan);
      box(fenceMetalMat,at(width/2-0.14,Math.min(1.02,top-0.10),0.079),0.21,0.035,0.055,tan);
    }
  }

  const doorX = frontDoorX();
  const gateOffset = 0.65 + postWidth/2;
  const corners = [[-hx,hz],[doorX-gateOffset,hz],[doorX+gateOffset,hz],[hx,hz],[hx,-hz],[-hx,-hz]];
  for(const [i,[x,z]] of corners.entries()){
    const [nextX,nextZ] = corners[(i+1)%corners.length];
    const start = new THREE.Vector3(x,0,z);
    const tan = new THREE.Vector3(nextX-x,0,nextZ-z);
    const length = tan.length();
    tan.normalize();
    const gate = i===1;
    const count = gate ? 1 : Math.ceil(length/2.65);
    const spacing = length/count;
    for(let p=0;p<count;p++){
      addPost(start.clone().addScaledVector(tan,p*spacing),tan);
      addPanel(start.clone().addScaledVector(tan,(p+0.5)*spacing),tan,spacing-postWidth-(gate ? 0.075 : 0.015),gate);
    }
  }
  if(pickets.length){
    const half = picketWidth/2;
    const shape = new THREE.Shape();
    shape.moveTo(-half,0); shape.lineTo(half,0); shape.lineTo(half,panelHeight-0.024);
    shape.quadraticCurveTo(0,panelHeight+0.024,-half,panelHeight-0.024);
    shape.closePath();
    const geometry = new THREE.ExtrudeGeometry(shape,{depth:0.038,bevelEnabled:false,curveSegments:12});
    const slats = new THREE.InstancedMesh(geometry,fencePanelMat,pickets.length);
    pickets.forEach((matrix,i)=>slats.setMatrixAt(i,matrix));
    slats.castShadow = slats.receiveShadow = true;
    fenceGroup.add(slats);
  }
  for(const [material,matrices] of boxes){
    const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(),material,matrices.length);
    matrices.forEach((matrix,i)=>mesh.setMatrixAt(i,matrix));
    mesh.castShadow = mesh.receiveShadow = true;
    fenceGroup.add(mesh);
  }
}

const bayDepth = 1.25;
function facadeBay(face, doorX){
  const edge = face.len/2 - 0.5;
  if(!face.door) return {offset:0,width:Math.min(3.15,2*edge)};
  const left = doorX - 1, right = doorX + 1;
  const [from,to] = left+edge >= edge-right ? [-edge,left] : [right,edge];
  return {offset:(from+to)/2,width:Math.min(3.15,to-from)};
}

function addFacadeBay(face, {offset,width}, roofLimit){
  const apexY = Math.min(S.H - 0.10,3.25,roofLimit - 0.08);
  const eave = apexY - 0.45;
  const bevel = Math.min(0.32,width*0.23), half = width/2;
  const at = (x,y,z) => face.c.clone().addScaledVector(face.t,offset+x).addScaledVector(Y,y).addScaledVector(face.n,z);
  const outline = [[-half,-0.12],[-half,bayDepth-bevel],[-half+bevel,bayDepth],
    [half-bevel,bayDepth],[half,bayDepth-bevel],[half,-0.12]];
  const apex = at(0,apexY,-0.12);
  const roofOutline = outline.map(([x,z])=>apex.clone().lerp(at(x,eave,z),1.13));
  for(let i=0;i<outline.length-1;i++){
    const [x,z] = outline[i], [nx,nz] = outline[i+1];
    const perimeter = y => [at(x,y,z),at(nx,y,nz)];
    addWall([...perimeter(0),...perimeter(0.5).reverse()],plinthMat);
    addWall([...perimeter(0.5),...perimeter(eave).reverse()],wallMat);
    const tan = at(nx,0,nz).sub(at(x,0,z));
    const length = tan.length();
    tan.normalize();
    const out = new THREE.Vector3().crossVectors(tan,Y);
    const center = at((x+nx)/2,0,(z+nz)/2);
    const windowHeight = Math.min(1.55,eave-0.73);
    addOpening(center,out,tan,0,(eave+0.50)/2,Math.min(1.95,length-0.23),windowHeight,'win');
    addRoofSurface(slopeGeometry([roofOutline[i],roofOutline[i+1],apex]));
  }
}

function addWall(points, material){
  const mesh = new THREE.Mesh(flatGeometry(points),material);
  mesh.castShadow = mesh.receiveShadow = true;
  house.add(mesh);
}

function addRoofSurface(s){
  s.g.dispose();
  s.g = roofReliefGeometry(s,{...MATS[S.mat],pan:S.falzPan},tileQuality);
  const mesh = new THREE.Mesh(s.g,roofMat);
  mesh.userData.roofProfile = S.mat;
  mesh.userData.roofPan = S.falzPan;
  mesh.receiveShadow = true;
  roofSurfaceMeshes.push({mesh,s});
  const backing = new THREE.Mesh(flatGeometry(s.pts),roofBackingMat);
  backing.position.y = -0.006;
  backing.castShadow = backing.receiveShadow = true;
  house.add(mesh,backing);
}

function makeTree(x, z, kind, s){
  const g = new THREE.Group();
  if(kind === 'spruce'){
    const trunk = rod(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1.0*s,0), 0.13*s, trunkMat, 7); g.add(trunk);
    for(let i=0;i<3;i++){
      const r = (1.5 - i*0.38)*s, h = (2.0 - i*0.35)*s;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), spruceMat);
      cone.position.y = (1.1 + i*1.05)*s + h/2 - 0.2*s; cone.castShadow = true; g.add(cone);
    }
  } else {
    const trunk = rod(new THREE.Vector3(0,0,0), new THREE.Vector3(0,2.0*s,0), 0.15*s, trunkMat, 7); g.add(trunk);
    const mat = leafMats[Math.floor((x*7+z*3)%3+3)%3];
    for(const [dx,dy,dz,r] of [[0,3.0,0,1.5],[0.7,2.6,0.3,1.05],[-0.6,2.7,-0.4,1.1],[0.1,3.7,0.2,0.95]]){
      const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(r*s, 2), mat);
      blob.position.set(dx*s, dy*s, dz*s); blob.castShadow = true; g.add(blob);
    }
  }
  g.position.set(x, 0, z);
  envGroup.add(g);
}

let kit = {};
let environmentKey = '';
let pendingBuild = false;
function scheduleBuild(){
  if(pendingBuild) return;
  pendingBuild = true;
  requestAnimationFrame(() => { pendingBuild = false; tileQuality='overview'; build(); });
}

// ширина ската (интервал u) на высоте v
function spanAt(s, v){
  let umin = Infinity, umax = -Infinity;
  for(let i=0;i<s.uv.length;i++){
    const p = s.uv[i], q = s.uv[(i+1)%s.uv.length];
    if((p[1]-v)*(q[1]-v) <= 0 && Math.abs(q[1]-p[1]) > 1e-6){
      const u = p[0] + (q[0]-p[0])*(v-p[1])/(q[1]-p[1]);
      umin = Math.min(umin, u); umax = Math.max(umax, u);
    }
  }
  return [umin, umax];
}

function dormerLayout(s){
  const vMax = Math.max(...s.uv.map(([,v])=>v));
  const low = s.hasSnowGuard ? 1.25 : 0.56;
  const overhang = Math.min(0.30,0.13/Math.hypot(s.V.x,s.V.z));
  const fits = (u,v,half) => {
    const [min,max] = spanAt(s,v);
    return u-half>=min+0.12 && u+half<=max-0.12;
  };
  for(const [half,wall,rise] of [[0.84,0.79,0.52],[0.69,0.62,0.42],[0.58,0.48,0.35]]){
    const sideBack = low + (wall+0.035)/s.V.y;
    const ridgeBack = low + (wall+rise+0.035)/s.V.y;
    if(ridgeBack+0.16>vMax) continue;
    const front = low-overhang;
    const [min,max] = spanAt(s,sideBack);
    const u = (min+max)/2;
    if(fits(u,front,half+0.09) && fits(u,sideBack,half+0.09) && fits(u,ridgeBack,0.03)){
      return {u,low,front,half,wall,rise,sideBack,ridgeBack};
    }
  }
  return null;
}

function overlapsDormer(s,[u,v],halfWidth,halfLength){
  const d = s.dormer;
  return !!d && Math.abs(u-d.u)<d.half+0.23+halfWidth &&
    v+halfLength>d.front-0.12 && v-halfLength<d.ridgeBack+0.12;
}

function addDormer(s){
  const {u,low,front,half,wall,rise,sideBack,ridgeBack} = s.dormer;
  const origin = s.o.clone().addScaledVector(s.U,u).addScaledVector(s.V,low);
  const at = (x,v,y) => {
    const point = origin.clone().addScaledVector(s.U,x).addScaledVector(s.V,v-low);
    point.y = origin.y + y;
    return point;
  };
  const peak = wall+rise;
  const roofHalf = half+0.09;
  const wallTop = peak - rise*half/roofHalf;
  addWall([at(-half,low,-0.035),at(half,low,-0.035),at(half,low,wallTop),
    at(0,low,peak),at(-half,low,wallTop)],wallMat);
  const end = low + (wallTop+0.035)/s.V.y;
  for(const sign of [-1,1]){
    addWall([at(sign*half,low,-0.035),at(sign*half,low,wallTop),at(sign*half,end,wallTop)],wallMat);
    addRoofSurface(slopeGeometry([at(sign*roofHalf,front,wall),at(sign*roofHalf,sideBack,wall),
      at(0,ridgeBack,peak),at(0,front,peak)]));
  }
  const out = new THREE.Vector3(-s.V.x,0,-s.V.z).normalize();
  addOpening(origin,out,s.U,0,origin.y+wall*0.53,half*1.34,wall*0.62,'win');
}

const skylightHalfWidth = 0.39, skylightHalfLength = 0.59;
function skylightSpan(s, v){
  const [lo1, hi1] = spanAt(s, v - skylightHalfLength - 0.15);
  const [lo2, hi2] = spanAt(s, v + skylightHalfLength + 0.15);
  const margin = 0.45 + skylightHalfWidth;
  return [Math.max(lo1, lo2) + margin, Math.min(hi1, hi2) - margin];
}

function skylightsOverlap([u, v], [otherU, otherV]){
  return Math.abs(u - otherU) < 2*skylightHalfWidth + 0.32 &&
         Math.abs(v - otherV) < 2*skylightHalfLength + 0.30;
}

function placeSkylight({group, frame, s, point:[u,v]}){
  needsRender=true;
  const lift = S.mat==='tile' ? 0.048 : S.mat==='bavaria' ? 0.058 : 0;
  group.position.copy(s.o).addScaledVector(s.U,u).addScaledVector(s.V,v).addScaledVector(s.n,lift);
  // Extend the frame towards the roof so it supports the raised flashing.
  frame.scale.y = 1+lift/0.13;
  frame.position.copy(s.n).multiplyScalar(0.08-lift/2);
}

function overlapsVent([u,v], [ventU,ventV]){
  return Math.abs(u-ventU)<skylightHalfWidth+0.43 &&
         Math.abs(v-ventV)<skylightHalfLength+0.50;
}

function ventSpan(s,v){
  const [lowStart,highStart] = spanAt(s,v-0.37);
  const [lowEnd,highEnd] = spanAt(s,v+0.37);
  return [Math.max(lowStart,lowEnd)+0.40, Math.min(highStart,highEnd)-0.40];
}

function ventOverlaps(s,point,except){
  return overlapsDormer(s,point,0.29,0.36) ||
    skylightMeshes.some(w=>w.s===s && overlapsVent(w.point,point)) ||
    roofVents.some(vent=>vent!==except && vent.s===s &&
      Math.abs(vent.point[0]-point[0])<0.64 && Math.abs(vent.point[1]-point[1])<0.76);
}

function findRoofVent(slopes, saved, selectedSlope){
  const facing = ({n}) => 0.78*n.x+0.95*n.z;
  const order = selectedSlope !== undefined ? [selectedSlope] : saved ? [saved[0]]
    : slopes.map((_,i)=>i).sort((a,b)=>facing(slopes[b])-facing(slopes[a]));
  if(saved && selectedSlope!==undefined && saved[0]!==selectedSlope) return null;
  for(const slopeIndex of order){
    const s = slopes[slopeIndex];
    if(!s) continue;
    const manualSlope = selectedSlope!==undefined;
    const lo = manualSlope && !s.hasSnowGuard ? 0.45 : 1.2;
    const top = Math.max(...s.uv.map(([,v])=>v));
    const hi = top-(manualSlope ? 0.43 : 0.52);
    if(hi<lo) continue;
    const heights = saved ? [saved[2]] : [0.73,0.61,0.86,0.49,0.29].map(fraction=>
      Math.max(lo,Math.min(hi,top*fraction)));
    for(const v of heights){
      if(v<lo || v>hi) continue;
      const [min,max] = ventSpan(s,v);
      if(!(min<=max)) continue;
      const positions = saved ? [saved[1]] : [0.68,0.32,0.92,0.08,0.50,0.22,0.78].map(offset=>min+(max-min)*offset);
      for(const u of positions){
        const point = [u,v];
        if(u>=min && u<=max && !ventOverlaps(s,point)) return {s,slopeIndex,lo,hi,point};
      }
    }
  }
  return null;
}

function placeVent({s,group,point:[u,v]}){
  group.position.copy(s.o).addScaledVector(s.U,u).addScaledVector(s.V,v);
  needsRender=true;
}

function addRoofVent(vent){
  const {s} = vent;
  const group = new THREE.Group();
  const flashingHeight = MATS.bavaria.height+0.005;
  const flashingCenter = s.n.clone().multiplyScalar(flashingHeight/2);
  group.add(orientedBox(0.54,flashingHeight,0.66,s.U,s.n,flashingCenter,trimMat));
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.182,0.215,0.048,32),trimMat);
  collar.position.copy(s.n).multiplyScalar(flashingHeight+0.009);
  collar.quaternion.setFromUnitVectors(Y,s.n);
  collar.scale.z = 1.14;
  collar.castShadow = collar.receiveShadow = true;
  group.add(collar);

  // Vertical duct with a rounded base, tapered stem, louvres and a rain cap.
  const section = [
    [0,-0.12],[0.108,-0.12],[0.108,0.015],[0.145,0.035],[0.161,0.090],
    [0.169,0.143],[0.165,0.183],[0.165,0.192],[0.153,0.197],
    [0.166,0.202],[0.163,0.247],[0.146,0.286],[0.119,0.315],
    [0.100,0.337],[0.096,0.408],[0.094,0.418],[0.122,0.638],
    [0.151,0.638],[0.151,0.652],[0.103,0.655]
  ];
  for(let i=0;i<3;i++){
    const y=0.678+i*0.025;
    section.push([0.103,y-0.010],[0.120,y-0.004],[0.147,y],[0.147,y+0.007],[0.103,y+0.008]);
  }
  section.push([0.105,0.750],[0.150,0.751],[0.150,0.765],[0.146,0.781],[0.131,0.793],[0.011,0.834],[0,0.836]);
  const body = new THREE.Mesh(new THREE.LatheGeometry(section.map(([r,h])=>new THREE.Vector2(r,h)),40),trimMat);
  body.castShadow = body.receiveShadow = true;
  group.add(body);
  vent.group=group;
  roofVents.push(vent);
  placeVent(vent);
  house.add(group);
}

function build(){
  endRoofItemDrag();
  skylightMeshes.length = 0;
  roofVents.length = 0;
  const M = roofModel();
  const corrected=S.O!==M.effectiveOverhang;
  S.O=M.effectiveOverhang;
  const overhangInput=document.getElementById('slider-O');
  if(overhangInput){
    overhangInput.max=M.maxOverhang;overhangInput.value=S.O;
    overhangInput.parentElement.querySelector('b').textContent=S.O.toFixed(2)+' м';
  }
  const note=document.getElementById('overhang-note');
  if(note) note.textContent=M.maxOverhang<.9 ? `${corrected ? 'Свес уменьшен. ' : ''}Для этой ломаной крыши свес до ${M.maxOverhang.toFixed(2)} м: карниз остаётся не ниже 1,8 м.` : '';
  needsRender=true;
  clearGroup(house);
  roofSurfaceMeshes.length=0;
  const { W, L, H, O } = S;

  // стены, цоколь, отмостка, тень
  const body = new THREE.Mesh(new THREE.BoxGeometry(W, H, L), wallMat);
  body.position.y = H/2; body.castShadow = body.receiveShadow = true; house.add(body);
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(W+0.12, 0.5, L+0.12), plinthMat);
  plinth.position.y = 0.25; plinth.castShadow = plinth.receiveShadow = true; house.add(plinth);
  const paving = new THREE.Mesh(new THREE.PlaneGeometry(W+1.6, L+1.6).rotateX(-Math.PI/2), pavingMat);
  paving.position.y = 0.006; paving.receiveShadow = true; house.add(paving);
  const ao = new THREE.Mesh(new THREE.PlaneGeometry((W+0.6)/0.5625, (L+0.6)/0.5625).rotateX(-Math.PI/2), aoMat);
  ao.position.y = 0.012; ao.renderOrder = 1; house.add(ao);

  // окна и дверь
  const faces = [
    { id:'front', c:new THREE.Vector3(0,0, L/2), n:new THREE.Vector3(0,0,1),  t:new THREE.Vector3(1,0,0),  len:W, door:true },
    { id:'back',  c:new THREE.Vector3(0,0,-L/2), n:new THREE.Vector3(0,0,-1), t:new THREE.Vector3(-1,0,0), len:W },
    { id:'right', c:new THREE.Vector3( W/2,0,0), n:new THREE.Vector3(1,0,0),  t:new THREE.Vector3(0,0,-1), len:L },
    { id:'left',  c:new THREE.Vector3(-W/2,0,0), n:new THREE.Vector3(-1,0,0), t:new THREE.Vector3(0,0,1),  len:L },
  ];
  const floors = H >= 5.4 ? [1.6, H - 1.45] : [Math.min(1.65, H - 1.05)];
  const doorX = frontDoorX();
  for(const f of faces){
    const count = faceOpeningCount(f.len);
    const step = f.len / count;
    const doorIndex = f.door ? Math.floor(count/2) : -1;
    const bay = S.bayFaces.includes(f.id) ? facadeBay(f,doorX) : null;
    for(let i=0;i<count;i++){
      const off = -f.len/2 + step*(i+0.5);
      floors.forEach((fy, fi) => {
        if(fi === 0 && i === doorIndex) addOpening(f.c,f.n,f.t,off,1.15,1.0,2.1,'door');
        else if(fi !== 0 || !bay || Math.abs(off-bay.offset)>bay.width/2+0.64) addOpening(f.c,f.n,f.t,off,fy,1.1,1.3,'win');
      });
    }
    if(bay) addFacadeBay(f,bay,M.y0);
  }
  const pathLength = S.fence === 'none' ? 7 : fenceSetback-0.8+0.15;
  const path = new THREE.Mesh(new THREE.PlaneGeometry(1.4,pathLength).rotateX(-Math.PI/2),pathMat);
  path.position.set(doorX,0.007,L/2+0.8+pathLength/2); path.receiveShadow = true; house.add(path);
  buildFence();

  // крыша
  const lift = new THREE.Vector3(0, 0.04, 0);
  // Шатровые скаты и рёбра используют общие объекты вершин.
  const roofPoints = new Set([...M.slopes.flat(), ...M.ridges.flat()]);
  for(const p of roofPoints) p.add(lift);
  M.y0 += 0.04;

  kit = { area:0, ridge:0, rake:0, eave:0, snow:0 };
  const infos = [];
  const edgeSlopes = new Map();
  const key = (a,b) => [a,b].map(p => `${p.x.toFixed(3)},${p.y.toFixed(3)},${p.z.toFixed(3)}`).sort().join('|');
  for(const pts of M.slopes){
    const s = slopeGeometry(pts);
    kit.area += s.area;
    addRoofSurface(s);
    infos.push(s);
    for(let i=0;i<s.pts.length;i++){
      const k = key(s.pts[i], s.pts[(i+1)%s.pts.length]);
      if(!edgeSlopes.has(k)) edgeSlopes.set(k, []);
      edgeSlopes.get(k).push(s);
    }
  }

  const eaves = [];
  for(const s of infos){
    for(let i=0;i<s.pts.length;i++){
      const a = s.pts[i], b = s.pts[(i+1)%s.pts.length];
      const len = a.distanceTo(b);
      const X = b.clone().sub(a).normalize();
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const Z = new THREE.Vector3().crossVectors(X, s.n).normalize();
      const sgn = Math.sign(Z.dot(mid.clone().sub(s.centroid))) || 1;
      const horizontal = Math.abs(a.y - b.y) < 1e-3;
      const shared = edgeSlopes.get(key(a,b)).length > 1;
      if(horizontal && Math.abs(a.y - M.y0) < 1e-3){
        const out = new THREE.Vector3(-s.V.x, 0, -s.V.z).normalize();
        eaves.push({ a, b, out, len });
        kit.eave += len;
        if(S.trims) house.add(orientedBox(len, 0.06, 0.015, X, s.n, mid.clone().addScaledVector(Z, sgn*0.015).addScaledVector(s.n, -0.035), trimMat));
      } else if(!horizontal && !shared){
        kit.rake += len;
        if(S.trims){
          // торцевая планка: лицевая полка + верхняя полка на скате
          house.add(orientedBox(len+0.04, 0.17, 0.02, X, s.n, mid.clone().addScaledVector(Z, sgn*0.03).addScaledVector(s.n, -0.035), trimMat));
          house.add(orientedBox(len+0.04, 0.015, 0.10, X, s.n, mid.clone().addScaledVector(Z, -sgn*0.02).addScaledVector(s.n, 0.035), trimMat));
        }
      }
    }
  }

  // Коньковые и переходные планки повторяют наклон прилегающих скатов.
  for(const [a,b] of M.ridges){
    kit.ridge += a.distanceTo(b);
    addRidgeCap(a,b,edgeSlopes.get(key(a,b)));
  }

  if(S.gutter){
    for(const eave of eaves) addGutter(eave,eaves,O);
  }

  // снегозадержатели (трубчатые) — над карнизом каждого ската с карнизом
  if(S.snow){
    for(const s of infos){
      const hasEave = s.pts.some((p,i) => { const q = s.pts[(i+1)%s.pts.length]; return Math.abs(p.y-M.y0)<1e-3 && Math.abs(q.y-M.y0)<1e-3; });
      if(!hasEave) continue;
      const vMax = Math.max(...s.uv.map(x => x[1]));
      if(vMax < 1.8) continue;
      const v0 = Math.min(0.8, vMax*0.3);
      const [lowStart,highStart] = spanAt(s,v0-0.24);
      const [lowEnd,highEnd] = spanAt(s,v0+0.24);
      const umin = Math.max(lowStart,lowEnd)+0.3;
      const umax = Math.min(highStart,highEnd)-0.3;
      if(umax - umin < 0.8) continue;
      s.hasSnowGuard=true;
      addSnowGuard(s,v0,umin,umax);
      kit.snow += umax - umin;
    }
  }

  for(const index of S.slopeDormers){
    const s = infos[index];
    if(!s) continue;
    s.dormer = dormerLayout(s);
    if(s.dormer) addDormer(s);
  }

  // мансардные окна: рама + стекло + оклад, в плоскости ската
  {
    const maxA = Math.max(...infos.map(x => x.area));
    const hw = skylightHalfWidth, hl = skylightHalfLength;
    for(const [slopeIndex, s] of infos.entries()){
      const requested = S.slopeWindows ? S.slopeWindows[slopeIndex] ?? 0 : S.skyN;
      if(!requested || (!S.slopeWindows && s.area<maxA*0.35)) continue;
      const vMax = Math.max(...s.uv.map(x => x[1]));
      const lo = !S.slopeWindows || s.hasSnowGuard ? 1+hl : hl+0.19;
      const hi = vMax-hl-(S.slopeWindows ? 0.20 : 0.5);
      if(hi < lo) continue;
      const vc = lo + (hi - lo)*THREE.MathUtils.clamp((S.skyPos - 0.2)/0.6, 0, 1);
      const [umin, umax] = skylightSpan(s, vc);
      if(!(umax >= umin)) continue;
      let n = requested;
      while(n > 1 && (umax - umin)/(n - 1) < 2*hw + 0.7) n--;
      const defaults = Array.from({length:n}, (_, i) => [
        n === 1 ? (umin + umax)/2 : umin + (umax - umin)*i/(n - 1), vc
      ]);
      const positions = defaults.map((point, i) => {
        const saved = S.skylights[`${slopeIndex}:${i}`];
        if(!saved || saved[1] < lo || saved[1] > hi) return point;
        const [min, max] = skylightSpan(s, saved[1]);
        return saved[0] >= min && saved[0] <= max ? saved : point;
      });
      const overlaps = positions.some((point, i) =>
        positions.slice(0, i).some(other => skylightsOverlap(point, other)));
      let layout = overlaps ? defaults : positions;
      if(s.dormer){
        const hitsDormer = point => overlapsDormer(s,point,hw+0.16,hl+0.15);
        const occupied = layout.filter(point=>!hitsDormer(point));
        const alternatives = [vc,lo,hi,(lo+vc)/2,(vc+hi)/2].flatMap(v=>{
          const [a,b] = skylightSpan(s,v);
          return a<=b ? [0.5,0,1,0.25,0.75].map(fraction=>[a+(b-a)*fraction,v]) : [];
        }).filter(point=>!hitsDormer(point));
        layout = layout.map(point=>{
          if(!hitsDormer(point)) return point;
          const replacement = alternatives.find(candidate=>occupied.every(other=>!skylightsOverlap(candidate,other)));
          if(replacement) occupied.push(replacement);
          return replacement;
        });
      }
      for(const [i, point] of layout.entries()){
        if(!point) continue;
        const group = new THREE.Group();
        const height = (offset, along = 0) => s.n.clone().multiplyScalar(offset).addScaledVector(s.V, along);
        const frame = orientedBox(2*hw+0.08, 0.13, 2*hl+0.08, s.U, s.n, height(0.08), skyFrameMat);
        group.add(
          orientedBox(2*hw+0.32, 0.03, 2*hl+0.3, s.U, s.n, height(0.03), skyFrameMat),
          frame,
          orientedBox(2*hw-0.06, 0.02, 2*hl-0.1, s.U, s.n, height(0.15, -0.01), skyGlassMat),
          orientedBox(2*hw+0.06, 0.04, 0.07, s.U, s.n, height(0.16, hl+0.01), skyFrameMat)
        );
        const skylight = {group, frame, s, slopeIndex, lo, hi, point, key:`${slopeIndex}:${i}`};
        placeSkylight(skylight);
        house.add(group);
        skylightMeshes.push(skylight);
      }
    }
  }

  const ventRequests = S.slopeVents
    ? infos.flatMap((_,slopeIndex)=>Array.from({length:S.slopeVents[slopeIndex] ?? 0},(_,i)=>
      ({key:`${slopeIndex}:${i}`,slopeIndex})))
    : Array.from({length:S.ventN},(_,key)=>({key}));
  for(const {key,slopeIndex} of ventRequests){
    if(!S.vents[key]) continue;
    const saved = findRoofVent(infos,S.vents[key],slopeIndex);
    if(saved) addRoofVent({...saved,key});
  }
  for(const {key,slopeIndex} of ventRequests){
    if(roofVents.some(vent=>vent.key===key)) continue;
    const placement = findRoofVent(infos,undefined,slopeIndex);
    if(placement) addRoofVent({...placement,key});
  }
  updateSlopeControls(infos,M.y0);

  for(const pts of M.walls) addWall(pts,wallMat);

  // деревья
  const fenced = S.fence !== 'none';
  const nextEnvironmentKey = `${W}:${L}:${S.trees}:${fenced}`;
  if(environmentKey !== nextEnvironmentKey){
    clearGroup(envGroup);
    environmentKey = nextEnvironmentKey;
    if(S.trees){
    const R = Math.hypot(W, L)/2 + 4.5;
    for(const [ang, dr, kind, sc] of [[-55,0.5,'round',1.1],[-105,2.5,'spruce',1.15],[125,1.5,'round',1.25],[165,3.5,'spruce',1.3],[210,0.8,'round',0.95],[255,2.2,'spruce',1.0],[-150,6,'round',1.0]]){
      const a = ang*Math.PI/180, r = R + dr;
      const x = Math.sin(a)*r, z = Math.cos(a)*r;
      const outsideFence = Math.max(Math.abs(x)/(W/2+fenceSetback+1.6*sc),Math.abs(z)/(L/2+fenceSetback+1.6*sc));
      const factor = fenced ? Math.max(1,1/outsideFence) : 1;
      makeTree(x*factor,z*factor,kind,sc);
    }
    }
  }

  updateStats(M.pitchText);
}

  const typ = TYPES.find(x => x.id === S.type);
  document.getElementById('stats').innerHTML =
    `<b>${typ.name}</b> · скатов: ${typ.n}<br>` +

function applyLook(){
  document.getElementById('falz-options').hidden = S.mat!=='falz';
  needsRender=true;
  for(const {mesh,s} of roofSurfaceMeshes){
    if(mesh.userData.roofProfile!==S.mat || (S.mat==='falz' && mesh.userData.roofPan!==S.falzPan)){
      endRoofItemDrag();
      mesh.geometry.dispose();
      mesh.geometry=roofReliefGeometry(s,{...MATS[S.mat],pan:S.falzPan},tileQuality);
      s.g=mesh.geometry;
      mesh.userData.roofProfile=S.mat;
      mesh.userData.roofPan=S.falzPan;
    }
  }
  for(const skylight of skylightMeshes) placeSkylight(skylight);
  updateStats(roofModel().pitchText);
  const r = RAL.find(r => r[0] === S.ral);
  roofMat.color.set(r[2]); trimMat.color.set(r[2]); roofBackingMat.color.set(r[2]);
  const fenceColor = RAL.find(color=>color[0]===S.fenceRal);

  fenceMetalMat.color.set(fenceColor[2]);

  const c = COATS[S.coat];

  roofMat.clearcoat = S.coat === 'gloss' ? .38 : (S.coat === 'pural' ? .16 : 0);
  roofMat.clearcoatRoughness = S.coat === 'gloss' ? .2 : .5;
  roofMat.metalness = trimMat.metalness = c.m;
  U.uProfile.value = MATS[S.mat].prof;
  U.uFalzPan.value = ['plain','ribs','narrow','wide'].indexOf(S.falzPan);
  U.uPer.value = MATS[S.mat].per;
  U.uHeight.value = MATS[S.mat].height;
  U.uMatteTexture.value = S.coat==='matt';
  document.getElementById('ralname').textContent = `RAL ${r[0]} · ${r[1]}`;
  const f = FACADE[S.facade];
  WU.uKind.value = f[0]; wallMat.color.set(f[1]);
  document.getElementById('facname').textContent = f[2];

  document.getElementById('plname').textContent = PLINTH[S.plinth][1];
  frameMat.color.set(FRAMES[S.frames][0]);
  const gc = GUTTER.find(g => g[0] === S.gutCol);
  gutterMat.color.set(gc[2] || r[2]);
  gutterMat.roughness = c.r; gutterMat.metalness = c.m;
  doorMat.color.set(S.frames === 2 ? '#6e4527' : (S.frames === 1 ? '#2f3236' : '#5a4232'));
}

function segment(el, items, key, onChange, html){
  el.innerHTML = '';
  for(const [id, label] of items){
    const b = document.createElement('button');
    b.innerHTML = html ? html(id, label) : label;
    if(S[key] === id) b.classList.add('on');
    b.setAttribute('aria-pressed', String(S[key] === id));
    b.onclick = () => {
      if(key === 'type' && S.type !== id){
        S.skylights = {}; S.vents = {}; S.slopeWindows = null; S.slopeVents = null; S.slopeDormers = [];
      }
      S[key] = id;
      for(const button of el.children){
        const selected = button===b;
        button.classList.toggle('on',selected);
        button.setAttribute('aria-pressed',String(selected));
      }
      onChange();
    };
    el.appendChild(b);
  }
}

}

  const fmt = s.fmt || (v => (s.step < 1 ? (+v).toFixed(s.step < 0.1 ? 2 : 1) : v) + s.unit);
  row.innerHTML = `<label for="slider-${s.k}"><span>${s.label}</span><b>${fmt(S[s.k])}</b></label><input id="slider-${s.k}" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${S[s.k]}">`;
  const inp = row.querySelector('input'), out = row.querySelector('b');
